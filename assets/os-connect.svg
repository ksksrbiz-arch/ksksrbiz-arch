<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Get in touch: email skdev@1commerce.online, or find 1COMMERCE at 1commerce.online, 1commerce.shop, LinkedIn in/1commerce-future, YouTube @0nestakk and Instagram @1commerce_llc">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .glow { animation:gl 3.2s ease-in-out infinite; }
    @keyframes gl { 0%,100%{opacity:.88} 50%{opacity:1} }
    .arr { animation:ar 2s ease-in-out infinite; }
    @keyframes ar { 0%,100%{transform:translateX(0);opacity:.7} 50%{transform:translateX(3px);opacity:1} }
    .ic { animation:ic 4.4s ease-in-out infinite; }
    .i2{animation-delay:.5s}.i3{animation-delay:1s}.i4{animation-delay:1.5s}.i5{animation-delay:2s}
    @keyframes ic { 0%,100%{opacity:.82} 50%{opacity:1} }
  </style>
  <defs>
    <clipPath id="cn"><rect width="1200" height="64" rx="14"/></clipPath>
    <linearGradient id="cng" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD1C5"/><stop offset="1" stop-color="#68D391"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#cn)">
    <rect width="1200" height="64" fill="#161C26"/>
    <rect class="glow" x="16" y="12" width="420" height="40" rx="20" fill="url(#cng)"/>
    <path d="M50 26 h22 v14 h-22 z M50 26 l11 8 l11 -8" fill="none" stroke="#0F131B" stroke-width="1.8" stroke-linejoin="round"/>
