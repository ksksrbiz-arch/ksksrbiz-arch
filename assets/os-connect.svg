      <rect x="1057" y="25" width="14" height="14" rx="4.5" fill="none" stroke="#B794F6" stroke-width="1.5"/><circle cx="1064" cy="32" r="3.4" fill="none" stroke="#B794F6" stroke-width="1.5"/><circle cx="1068.4" cy="27.6" r="1.1" fill="#B794F6"/>
