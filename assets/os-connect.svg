      <text x="665" y="42" class="mono" font-size="9.5" fill="#7C8798">1commerce.shop</text>
    </g>
    <g class="ic i3">
      <circle cx="782" cy="32" r="15" fill="#63B3ED" fill-opacity=".15" stroke="#63B3ED" stroke-opacity=".5"/>
      <text x="782" y="37" font-size="13" font-weight="800" fill="#63B3ED" text-anchor="middle">in</text>
      <text x="806" y="29" font-size="12" font-weight="700" fill="#F1F5FB">LinkedIn</text>
