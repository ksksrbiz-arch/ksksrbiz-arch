      <circle cx="500" cy="32" r="7" fill="none" stroke="#4FD1C5" stroke-width="1.6"/><ellipse cx="500" cy="32" rx="3" ry="7" fill="none" stroke="#4FD1C5" stroke-width="1.6"/><path d="M493 32 h14" stroke="#4FD1C5" stroke-width="1.6"/>
      <text x="524" y="29" font-size="12" font-weight="700" fill="#F1F5FB">Website</text>
      <text x="524" y="42" class="mono" font-size="9.5" fill="#7C8798">1commerce.online</text>
    </g>
    <g class="ic i2">
