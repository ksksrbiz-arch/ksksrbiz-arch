      <path d="M635 28 h12 l-1.5 11 h-9 z" fill="none" stroke="#F6AD55" stroke-width="1.6" stroke-linejoin="round"/><path d="M638 28 v-2.5 a3 3 0 0 1 6 0 V28" fill="none" stroke="#F6AD55" stroke-width="1.6"/>
