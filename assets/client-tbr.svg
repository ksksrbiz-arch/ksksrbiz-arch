<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img" aria-label="tobereadshop.com — To Be Read, a used bookstore in Milwaukie Oregon: browse, trade and shop thousands of titles">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .spine { transform-box:fill-box; transform-origin:50% 100%; animation:pull 8s ease-in-out infinite; }
    .s2{animation-delay:1s}.s3{animation-delay:2s}.s4{animation-delay:3s}
    .s5{animation-delay:4s}.s6{animation-delay:5s}.s7{animation-delay:6s}.s8{animation-delay:7s}
    @keyframes pull { 0%,10%,100%{transform:translateY(0)} 3%,7%{transform:translateY(-9px)} }
    .cta { animation:cta 3.2s ease-in-out infinite; }
    @keyframes cta { 0%,100%{opacity:.82} 50%{opacity:1} }
    .go { animation:go 2.6s ease-in-out infinite; }
    @keyframes go { 0%,100%{opacity:.6} 50%{opacity:1} }
  </style>
  <defs><clipPath id="tb"><rect width="380" height="240" rx="12"/></clipPath></defs>
  <g clip-path="url(#tb)">
    <rect width="380" height="240" fill="#0F131B"/>
    <rect width="380" height="24" fill="#1B2230"/><rect y="23" width="380" height="1" fill="#2B3648"/>
    <circle cx="14" cy="12" r="4" fill="#FF5F57"/><circle cx="28" cy="12" r="4" fill="#FEBC2E"/><circle cx="42" cy="12" r="4" fill="#28C840"/>
    <text x="190" y="16" class="mono" font-size="10.5" fill="#7C8798" text-anchor="middle">tobereadshop.com</text>

    <!-- site header -->
    <rect y="24" width="380" height="30" fill="#161C26"/>
    <text x="18" y="44" font-size="14" font-weight="800" fill="#F6AD55" font-family="Georgia,serif">To Be Read</text>
    <g class="mono" font-size="8.5" fill="#7C8798">
      <text x="196" y="43">BROWSE</text><text x="248" y="43">TRADE</text><text x="292" y="43">EVENTS</text>
    </g>
    <circle cx="352" cy="39" r="5.5" fill="none" stroke="#7C8798" stroke-width="1.4"/>
    <path d="M356 43 l4 4" stroke="#7C8798" stroke-width="1.4" stroke-linecap="round"/>

    <text x="18" y="72" class="mono" font-size="9.5" fill="#4C5870" letter-spacing="1.2">CLACKAMAS BOOK EXCHANGE · MILWAUKIE, OR</text>

    <!-- shelf of spines -->
    <g>
      <rect class="spine"    x="20"  y="86" width="20" height="74" rx="2" fill="#B794F6"/>
      <rect class="spine s2" x="44"  y="94" width="16" height="66" rx="2" fill="#4FD1C5"/>
      <rect class="spine s3" x="64"  y="82" width="22" height="78" rx="2" fill="#F6AD55"/>
      <rect class="spine s4" x="90"  y="98" width="15" height="62" rx="2" fill="#FC8181"/>
      <rect class="spine s5" x="109" y="88" width="19" height="72" rx="2" fill="#68D391"/>
      <rect class="spine s6" x="132" y="92" width="17" height="68" rx="2" fill="#63B3ED"/>
      <rect class="spine s7" x="153" y="84" width="21" height="76" rx="2" fill="#F6E05E"/>
      <rect class="spine s8" x="178" y="96" width="16" height="64" rx="2" fill="#B794F6"/>
      <g opacity=".45">
        <rect x="198" y="90" width="18" height="70" rx="2" fill="#4FD1C5"/>
        <rect x="220" y="86" width="20" height="74" rx="2" fill="#F6AD55"/>
        <rect x="244" y="94" width="16" height="66" rx="2" fill="#FC8181"/>
      </g>
      <!-- spine title ticks -->
      <g stroke="#0F131B" stroke-opacity=".45" stroke-width="1.2">
        <path d="M24 100 h12 M48 106 h8 M68 96 h14 M93 110 h9 M113 102 h11 M136 104 h9 M157 98 h13 M181 108 h9"/>
      </g>
      <rect x="18" y="160" width="248" height="5" rx="2" fill="#2B3648"/>
    </g>

    <!-- stat + CTA -->
    <rect x="276" y="82" width="86" height="40" rx="9" fill="#161C26" stroke="#2B3648"/>
    <text x="319" y="102" class="mono" font-size="15" font-weight="800" fill="#F1F5FB" text-anchor="middle">1,000s</text>
    <text x="319" y="115" class="mono" font-size="8" fill="#7C8798" text-anchor="middle">titles in store</text>

    <rect class="cta" x="276" y="130" width="86" height="30" rx="15" fill="#F6AD55"/>
    <text x="319" y="149" class="mono" font-size="9.5" font-weight="800" fill="#161C26" text-anchor="middle">TRADE BOOKS</text>

    <g class="mono" font-size="9" fill="#68D391">
      <text x="18" y="188">● online via PangoBooks + Bookshop.org</text>
    </g>

    <rect y="206" width="380" height="34" fill="#161C26"/><rect y="206" width="380" height="1" fill="#2B3648"/>
    <rect x="17" y="214" width="18" height="18" rx="5" fill="#F6AD55"/>
    <text x="26" y="227" class="mono" font-size="10" font-weight="800" fill="#161C26" text-anchor="middle">T</text>
    <text x="42" y="221" font-size="12.5" font-weight="700" fill="#F1F5FB">tobereadshop.com</text>
    <text x="42" y="233" class="mono" font-size="9" fill="#7C8798">client build · Next.js · hosted &amp; deployed</text>
    <text class="go" x="362" y="228" font-size="11.5" font-weight="700" fill="#4FD1C5" text-anchor="end">visit ▸</text>
    <rect x=".75" y=".75" width="378.5" height="238.5" rx="12" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
