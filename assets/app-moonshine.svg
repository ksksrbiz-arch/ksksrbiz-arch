<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" width="380" height="210" role="img" aria-label="montucky-moonshine-proposal — Shopify storefront redesign">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .slosh { transform-box: fill-box; transform-origin: 50% 100%; animation: slosh 3.4s ease-in-out infinite; }
    @keyframes slosh { 0%,100% {transform:rotate(-2deg);} 50% {transform:rotate(2deg);} }
    .bubble { animation: bub 2.8s ease-in infinite; }
    .bubble.b{animation-delay:.9s} .bubble.c{animation-delay:1.8s}
    @keyframes bub { 0% {transform:translateY(0); opacity:0;} 20% {opacity:.9;} 100% {transform:translateY(-26px); opacity:0;} }
    .cart { animation: cart 5s ease-in-out infinite; }
    @keyframes cart { 0%,15% {transform:translateX(0);} 55%,60% {transform:translateX(96px);} 100% {transform:translateX(96px); opacity:0;} }
    .awn { animation: awn 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
    @keyframes awn { 0%,100% {transform:skewX(0deg);} 50% {transform:skewX(2deg);} }
    .go { animation: go 2.4s ease-in-out infinite; }
    @keyframes go { 0%,100% {opacity:.6;} 50% {opacity:1;} }
  </style>
  <defs><clipPath id="w5"><rect width="380" height="210" rx="12"/></clipPath></defs>
  <g clip-path="url(#w5)">
    <rect width="380" height="210" fill="#161C26"/>
    <rect width="380" height="30" fill="#1B2230"/>
    <rect y="29" width="380" height="1" fill="#2B3648"/>
    <circle cx="18" cy="15" r="5" fill="#FF5F57"/><circle cx="35" cy="15" r="5" fill="#FEBC2E"/><circle cx="52" cy="15" r="5" fill="#28C840"/>
    <text x="190" y="20" font-size="12" fill="#7C8798" text-anchor="middle">Moonshine.app</text>

    <text x="22" y="66" font-size="20" font-weight="800" fill="#F1F5FB">montucky-moonshine</text>
    <text x="22" y="90" font-size="12.5" fill="#9AA6B8">Premium storefront redesign,</text>
    <text x="22" y="108" font-size="12.5" fill="#9AA6B8">wired straight into Shopify.</text>
    <rect x="22" y="128" width="112" height="22" rx="11" fill="#1B2230" stroke="#2B3648"/>
    <text x="34" y="143" font-size="11" fill="#95BF47" font-weight="700">SHOPIFY · LIVE</text>
    <text class="go" x="22" y="186" font-size="13" font-weight="700" fill="#F6AD55">Open project ▸</text>

    <!-- motif: storefront awning + sloshing jug + cart rolling to checkout -->
    <g>
      <!-- awning -->
      <g class="awn">
        <path d="M248 58 h116 l8 18 h-132 z" fill="#B794F6"/>
        <path d="M256 58 h14 l2 18 h-16 z M284 58 h14 l2 18 h-16 z M312 58 h14 l2 18 h-16 z M340 58 h14 l2 18 h-16 z" fill="#F1F5FB" opacity=".85"/>
      </g>
      <!-- jug -->
      <g class="slosh">
        <path d="M258 100 h24 v10 c10 4 14 12 14 22 v22 a8 8 0 0 1 -8 8 h-36 a8 8 0 0 1 -8 -8 v-22 c0 -10 4 -18 14 -22 z" fill="#E2E8F0"/>
        <rect x="262" y="94" width="16" height="8" rx="2" fill="#7C8798"/>
        <circle cx="286" cy="122" r="5" fill="none" stroke="#46536B" stroke-width="2"/>
        <text x="270" y="150" font-size="11" font-weight="800" fill="#1E2A4A" text-anchor="middle">XXX</text>
        <circle class="bubble"   cx="262" cy="116" r="2.4" fill="#4FD1C5"/>
        <circle class="bubble b" cx="270" cy="120" r="1.8" fill="#F6AD55"/>
        <circle class="bubble c" cx="256" cy="122" r="1.5" fill="#4FD1C5"/>
      </g>
      <!-- cart -->
      <g class="cart" stroke="#F6AD55" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M232 168 h6 l5 14 h20 l5 -11 h-26"/>
        <circle cx="248" cy="188" r="3.4"/><circle cx="262" cy="188" r="3.4"/>
      </g>
      <text x="340" y="186" font-size="10" fill="#7C8798" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="end">checkout →</text>
    </g>
    <rect x=".75" y=".75" width="378.5" height="208.5" rx="12" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
