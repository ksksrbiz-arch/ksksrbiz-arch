<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img" aria-label="montucky-moonshine-proposal — premium Shopify storefront: product grid, add to cart and a live cart badge">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .cur { animation:cur 6s ease-in-out infinite; }
    @keyframes cur {
      0%,10%{transform:translate(300px,180px);opacity:0}
      14%{opacity:1} 34%{transform:translate(188px,168px)}
      44%{transform:translate(188px,168px)} 46%{transform:translate(188px,171px)}
      52%{transform:translate(188px,168px)} 80%{transform:translate(300px,60px);opacity:1}
      92%,100%{opacity:0;transform:translate(300px,60px)}
    }
    .press { animation:pr 6s steps(1,end) infinite; }
    @keyframes pr { 0%,44%{opacity:0} 45%,51%{opacity:1} 52%,100%{opacity:0} }
    .badge0 { animation:b0 6s steps(1,end) infinite; }
    .badge1 { animation:b1 6s steps(1,end) infinite; }
    @keyframes b0 { 0%,51%{opacity:1} 52%,100%{opacity:0} }
    @keyframes b1 { 0%,51%{opacity:0} 52%,100%{opacity:1} }
    .pop { animation:pop 6s ease-out infinite; transform-box:fill-box; transform-origin:50% 50%; }
    @keyframes pop { 0%,51%{transform:scale(1)} 55%{transform:scale(1.3)} 60%,100%{transform:scale(1)} }
    .go { animation:go 2.6s ease-in-out infinite; }
    @keyframes go { 0%,100%{opacity:.6} 50%{opacity:1} }
  </style>
  <defs>
    <clipPath id="s"><rect width="380" height="240" rx="12"/></clipPath>
    <linearGradient id="jug" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6AD55"/><stop offset="1" stop-color="#B7791F"/></linearGradient>
  </defs>
  <g clip-path="url(#s)">
    <rect width="380" height="240" fill="#0F131B"/>
    <rect width="380" height="24" fill="#1B2230"/><rect y="23" width="380" height="1" fill="#2B3648"/>
    <circle cx="14" cy="12" r="4" fill="#FF5F57"/><circle cx="28" cy="12" r="4" fill="#FEBC2E"/><circle cx="42" cy="12" r="4" fill="#28C840"/>
    <text x="190" y="16" class="mono" font-size="10.5" fill="#7C8798" text-anchor="middle">montuckymoonshine.com</text>

    <!-- storefront nav -->
    <rect y="24" width="380" height="30" fill="#161C26"/>
    <text x="18" y="44" font-size="13" font-weight="800" fill="#F6AD55" font-family="Georgia,serif">MONTUCKY</text>
    <g class="mono" font-size="9" fill="#7C8798">
      <text x="132" y="43">SHOP</text><text x="172" y="43">STORY</text><text x="216" y="43">FIND US</text>
    </g>
    <path d="M330 38 h6 l4 12 h16 l4 -9 h-21" fill="none" stroke="#E2E8F0" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="345" cy="53" r="1.8" fill="#E2E8F0"/><circle cx="354" cy="53" r="1.8" fill="#E2E8F0"/>
    <g class="pop"><circle cx="357" cy="35" r="7.5" fill="#FC8181"/>
      <text x="357" y="38.5" class="mono" font-size="9" font-weight="800" fill="#0F131B" text-anchor="middle"><tspan class="badge0">1</tspan><tspan class="badge1" x="357">2</tspan></text>
    </g>

    <!-- product grid -->
    <g>
      <rect x="18" y="64" width="106" height="96" rx="8" fill="#161C26" stroke="#2B3648"/>
      <path d="M60 92 h22 v10 c9 4 12 11 12 19 v14 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 v-14 c0 -8 3 -15 12 -19 z" fill="url(#jug)"/>
      <rect x="64" y="87" width="14" height="7" rx="2" fill="#7C8798"/>
      <text x="71" y="152" class="mono" font-size="9" fill="#9AA6B8" text-anchor="middle">ORIGINAL 750</text>

      <rect x="136" y="64" width="106" height="96" rx="8" fill="#161C26" stroke="#4FD1C5" stroke-opacity=".5"/>
      <path d="M178 92 h22 v10 c9 4 12 11 12 19 v14 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 v-14 c0 -8 3 -15 12 -19 z" fill="#B794F6"/>
      <rect x="182" y="87" width="14" height="7" rx="2" fill="#7C8798"/>
      <text x="189" y="152" class="mono" font-size="9" fill="#F1F5FB" text-anchor="middle">HUCKLEBERRY</text>

      <rect x="254" y="64" width="106" height="96" rx="8" fill="#161C26" stroke="#2B3648"/>
      <path d="M296 92 h22 v10 c9 4 12 11 12 19 v14 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 v-14 c0 -8 3 -15 12 -19 z" fill="#68D391"/>
      <rect x="300" y="87" width="14" height="7" rx="2" fill="#7C8798"/>
      <text x="307" y="152" class="mono" font-size="9" fill="#9AA6B8" text-anchor="middle">APPLE PIE</text>
    </g>

    <!-- price + CTA -->
    <text x="18" y="182" class="mono" font-size="14" font-weight="800" fill="#F6AD55">$38.00</text>
    <text x="70" y="182" class="mono" font-size="9" fill="#4C5870">750ml · 100 proof</text>
    <rect x="136" y="168" width="106" height="26" rx="13" fill="#4FD1C5"/>
    <rect class="press" x="136" y="168" width="106" height="26" rx="13" fill="#2E6B75"/>
    <text x="189" y="185" class="mono" font-size="10" font-weight="800" fill="#0F131B" text-anchor="middle">ADD TO CART</text>
    <g class="mono" font-size="9" fill="#68D391"><text x="362" y="185" text-anchor="end">✓ Shopify checkout</text></g>

    <g class="cur"><path d="M0 0 L0 13 L3.7 10.2 L6.5 15.8 L8.6 14.7 L10.2 8.9 L5.8 9.2 Z" fill="#F1F5FB" stroke="#0F131B" stroke-width="1"/></g>

    <rect y="206" width="380" height="34" fill="#161C26"/><rect y="206" width="380" height="1" fill="#2B3648"/>
    <rect x="17" y="214" width="18" height="18" rx="5" fill="#68D391"/>
    <text x="26" y="227" class="mono" font-size="10" font-weight="800" fill="#161C26" text-anchor="middle">S</text>
    <text x="42" y="221" font-size="12.5" font-weight="700" fill="#F1F5FB">montucky-moonshine</text>
    <text x="42" y="233" class="mono" font-size="9" fill="#7C8798">storefront redesign · live demo</text>
    <text class="go" x="362" y="228" font-size="11.5" font-weight="700" fill="#4FD1C5" text-anchor="end">open ▸</text>
    <rect x=".75" y=".75" width="378.5" height="238.5" rx="12" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
