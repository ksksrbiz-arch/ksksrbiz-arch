<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="460" height="380" role="img" aria-label="Ops panel for the managed client sites: montuckymoonshine.com on Shopify, tobereadshop.com on Next.js and precisioncorebuilders.com on React, all live over HTTPS. Care plan covers SSL renewal, nightly backups, dependency and content updates, and uptime monitoring.">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .led { animation:led 2.6s ease-in-out infinite; }
    .l2{animation-delay:.35s}.l3{animation-delay:.7s}
    @keyframes led { 0%,100%{opacity:1} 50%{opacity:.25} }
    .sweep { animation:sw 6s ease-in-out infinite; }
    @keyframes sw { 0%,100%{opacity:0} 8%{opacity:.5} 50%{opacity:.5} 60%{opacity:0} }
    .chk { animation:ck 5.2s ease-in-out infinite; }
    .c2{animation-delay:.4s}.c3{animation-delay:.8s}.c4{animation-delay:1.2s}
    @keyframes ck { 0%,100%{opacity:.5} 50%{opacity:1} }
    .shield { transform-box:fill-box; transform-origin:50% 50%; animation:sh 4s ease-in-out infinite; }
    @keyframes sh { 0%,100%{opacity:.75} 50%{opacity:1} }
  </style>
  <defs><clipPath id="ac"><rect width="460" height="380" rx="14"/></clipPath></defs>
  <g clip-path="url(#ac)">
    <rect width="460" height="380" fill="#0F131B"/>
    <rect width="460" height="34" fill="#1B2230"/><rect y="33" width="460" height="1" fill="#2B3648"/>
    <circle cx="22" cy="17" r="6" fill="#FF5F57"/><circle cx="42" cy="17" r="6" fill="#FEBC2E"/><circle cx="62" cy="17" r="6" fill="#28C840"/>
    <text x="230" y="22" class="mono" font-size="13" fill="#7C8798" text-anchor="middle">ops — managed sites</text>

    <text x="22" y="60" class="mono" font-size="10" fill="#4C5870" letter-spacing="1.6">UNDER MANAGEMENT</text>
    <g class="shield">
      <path d="M436 50 l10 4 v7 c0 6 -4 10 -10 12 -6 -2 -10 -6 -10 -12 v-7 z" fill="#68D391" fill-opacity=".16" stroke="#68D391" stroke-width="1.4"/>
      <path d="M432 60 l3 3 6 -7" fill="none" stroke="#68D391" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- site rows -->
    <g>
      <rect x="22" y="72" width="416" height="44" rx="9" fill="#161C26"/>
      <rect class="sweep" x="22" y="72" width="416" height="44" rx="9" fill="#4FD1C5" fill-opacity=".07"/>
      <circle class="led" cx="40" cy="94" r="4.5" fill="#68D391"/>
      <text x="56" y="90" class="mono" font-size="11.5" fill="#F1F5FB">montuckymoonshine.com</text>
      <text x="56" y="106" class="mono" font-size="9.5" fill="#4C5870">craft spirits · retail</text>
      <rect x="336" y="83" width="58" height="19" rx="9.5" fill="#68D391" fill-opacity=".13" stroke="#68D391" stroke-opacity=".45"/>
      <text x="365" y="96" class="mono" font-size="9.5" fill="#68D391" text-anchor="middle">Shopify</text>
      <text x="428" y="97" class="mono" font-size="10" fill="#68D391" text-anchor="end">✓</text>

      <rect x="22" y="122" width="416" height="44" rx="9" fill="#161C26" fill-opacity=".6"/>
      <circle class="led l2" cx="40" cy="144" r="4.5" fill="#68D391"/>
      <text x="56" y="140" class="mono" font-size="11.5" fill="#F1F5FB">tobereadshop.com</text>
      <text x="56" y="156" class="mono" font-size="9.5" fill="#4C5870">used bookstore · Milwaukie, OR</text>
      <rect x="336" y="133" width="58" height="19" rx="9.5" fill="#63B3ED" fill-opacity=".13" stroke="#63B3ED" stroke-opacity=".45"/>
      <text x="365" y="146" class="mono" font-size="9.5" fill="#63B3ED" text-anchor="middle">Next.js</text>
      <text x="428" y="147" class="mono" font-size="10" fill="#68D391" text-anchor="end">✓</text>

      <rect x="22" y="172" width="416" height="44" rx="9" fill="#161C26"/>
      <circle class="led l3" cx="40" cy="194" r="4.5" fill="#68D391"/>
      <text x="56" y="190" class="mono" font-size="11.5" fill="#F1F5FB">precisioncorebuilders.com</text>
      <text x="56" y="206" class="mono" font-size="9.5" fill="#4C5870">custom homes · Eugene, OR</text>
      <rect x="336" y="183" width="58" height="19" rx="9.5" fill="#B794F6" fill-opacity=".13" stroke="#B794F6" stroke-opacity=".45"/>
      <text x="365" y="196" class="mono" font-size="9.5" fill="#B794F6" text-anchor="middle">React</text>
      <text x="428" y="197" class="mono" font-size="10" fill="#68D391" text-anchor="end">✓</text>
    </g>
    <text x="22" y="234" class="mono" font-size="9.5" fill="#4C5870">✓ = HTTPS with HSTS · all three live</text>

    <rect x="22" y="248" width="416" height="1" fill="#2B3648"/>

    <text x="22" y="272" class="mono" font-size="10" fill="#4C5870" letter-spacing="1.6">THE CARE PLAN COVERS</text>
    <g font-size="12" fill="#E2E8F0">
      <g class="chk">   <path d="M24 290 l4 4 8 -9" fill="none" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round"/><text x="48" y="295">SSL certificates, renewed</text></g>
      <g class="chk c2"><path d="M24 314 l4 4 8 -9" fill="none" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round"/><text x="48" y="319">Nightly backups</text></g>
      <g class="chk c3"><path d="M244 290 l4 4 8 -9" fill="none" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round"/><text x="268" y="295">Updates &amp; fixes</text></g>
      <g class="chk c4"><path d="M244 314 l4 4 8 -9" fill="none" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round"/><text x="268" y="319">Uptime monitoring</text></g>
    </g>

    <rect y="346" width="460" height="34" fill="#1B2230"/><rect y="346" width="460" height="1" fill="#2B3648"/>
    <text x="22" y="368" class="mono" font-size="11" fill="#7C8798">3 sites · built &amp; hosted here</text>
    <text x="438" y="368" class="mono" font-size="11" font-weight="700" fill="#4FD1C5" text-anchor="end">add yours ▸</text>
    <rect x=".75" y=".75" width="458.5" height="378.5" rx="14" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
