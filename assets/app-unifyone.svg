<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" width="380" height="210" role="img" aria-label="UnifyOne — multi-tenant commerce platform">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .hub { animation: hub 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    @keyframes hub { 0%,100% {transform:scale(1);} 50% {transform:scale(1.12);} }
    .lnk { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    .tn { animation: tn 3s ease-in-out infinite; }
    .tn.b {animation-delay:.7s} .tn.c {animation-delay:1.4s} .tn.d {animation-delay:2.1s}
    @keyframes tn { 0%,100% {opacity:.55;} 50% {opacity:1;} }
    .go { animation: go 2.4s ease-in-out infinite; }
    @keyframes go { 0%,100% {opacity:.6;} 50% {opacity:1;} }
  </style>
  <defs><clipPath id="w1"><rect width="380" height="210" rx="12"/></clipPath></defs>
  <g clip-path="url(#w1)">
    <rect width="380" height="210" fill="#161C26"/>
    <rect width="380" height="30" fill="#1B2230"/>
    <rect y="29" width="380" height="1" fill="#2B3648"/>
    <circle cx="18" cy="15" r="5" fill="#FF5F57"/><circle cx="35" cy="15" r="5" fill="#FEBC2E"/><circle cx="52" cy="15" r="5" fill="#28C840"/>
    <text x="190" y="20" font-size="12" fill="#7C8798" text-anchor="middle">UnifyOne.app</text>

    <text x="22" y="66" font-size="20" font-weight="800" fill="#F1F5FB">UnifyOne</text>
    <text x="22" y="90" font-size="12.5" fill="#9AA6B8">Multi-tenant commerce SaaS on</text>
    <text x="22" y="108" font-size="12.5" fill="#9AA6B8">Netlify + Supabase — the flagship.</text>
    <rect x="22" y="128" width="86" height="22" rx="11" fill="#1B2230" stroke="#2B3648"/>
    <text x="34" y="143" font-size="11" fill="#4FD1C5" font-weight="700">FLAGSHIP</text>
    <text class="go" x="22" y="186" font-size="13" font-weight="700" fill="#F6AD55">Open project ▸</text>

    <!-- motif: tenants orbiting one platform hub -->
    <g stroke="#46536B" stroke-width="1.5" fill="none">
      <path class="lnk" d="M292 120 L250 66"/>
      <path class="lnk" d="M292 120 L340 70"/>
      <path class="lnk" d="M292 120 L246 168"/>
      <path class="lnk" d="M292 120 L342 166"/>
    </g>
    <g class="hub">
      <circle cx="292" cy="120" r="22" fill="#FF8B6A"/>
      <text x="292" y="126" font-size="14" font-weight="800" fill="#161C26" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">1C</text>
    </g>
    <g font-family="'SFMono-Regular',Consolas,monospace" font-size="13" text-anchor="middle">
      <g class="tn"><rect x="232" y="50" width="36" height="24" rx="6" fill="#1B2230" stroke="#2B3648"/><text x="250" y="66" fill="#E2E8F0">🛍</text></g>
      <g class="tn b"><rect x="322" y="54" width="36" height="24" rx="6" fill="#1B2230" stroke="#2B3648"/><text x="340" y="70" fill="#E2E8F0">🛒</text></g>
      <g class="tn c"><rect x="228" y="152" width="36" height="24" rx="6" fill="#1B2230" stroke="#2B3648"/><text x="246" y="168" fill="#E2E8F0">📦</text></g>
      <g class="tn d"><rect x="324" y="150" width="36" height="24" rx="6" fill="#1B2230" stroke="#2B3648"/><text x="342" y="166" fill="#E2E8F0">💳</text></g>
    </g>
    <rect x=".75" y=".75" width="378.5" height="208.5" rx="12" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
