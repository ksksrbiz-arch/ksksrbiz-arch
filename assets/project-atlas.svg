<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img" aria-label="walking-dead-universe-atlas.vercel.app — a mobile-first data atlas for the Walking Dead Universe: map, timeline and character data across 19 normalized JSON registries">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .pin { transform-box:fill-box; transform-origin:50% 50%; animation:pin 2.6s ease-in-out infinite; }
    .p2{animation-delay:.5s}.p3{animation-delay:1s}.p4{animation-delay:1.5s}
    @keyframes pin { 0%,100%{transform:scale(1);opacity:.85} 50%{transform:scale(1.4);opacity:1} }
    .ring { animation:ring 2.6s ease-out infinite; transform-box:fill-box; transform-origin:50% 50%; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.6} 100%{transform:scale(2.2);opacity:0} }
    .scan { animation:sc 5s linear infinite; }
    @keyframes sc { 0%{transform:translateX(0)} 100%{transform:translateX(226px)} }
    .chip { animation:ch 6s steps(1,end) infinite; }
    .c2{animation-delay:2s}.c3{animation-delay:4s}
    @keyframes ch { 0%,33%{opacity:1} 34%,100%{opacity:.35} }
    .go { animation:go 2.6s ease-in-out infinite; }
    @keyframes go { 0%,100%{opacity:.6} 50%{opacity:1} }
  </style>
  <defs><clipPath id="at"><rect width="380" height="240" rx="12"/></clipPath></defs>
  <g clip-path="url(#at)">
    <rect width="380" height="240" fill="#0F131B"/>
    <rect width="380" height="24" fill="#1B2230"/><rect y="23" width="380" height="1" fill="#2B3648"/>
    <circle cx="14" cy="12" r="4" fill="#FF5F57"/><circle cx="28" cy="12" r="4" fill="#FEBC2E"/><circle cx="42" cy="12" r="4" fill="#28C840"/>
    <text x="190" y="16" class="mono" font-size="9.5" fill="#7C8798" text-anchor="middle">walking-dead-universe-atlas.vercel.app</text>

    <!-- site header -->
    <rect y="24" width="380" height="30" fill="#161C26"/>
    <path d="M18 47 l5 -13 l5 13 M21 42 h4" stroke="#FC8181" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
    <text x="34" y="44" font-size="12.5" font-weight="800" fill="#F1F5FB" letter-spacing=".4">TWDU ATLAS</text>
    <g class="mono" font-size="8.5" fill="#7C8798">
      <text x="196" y="43">MAP</text><text x="228" y="43">TIMELINE</text><text x="284" y="43">CHARACTERS</text>
    </g>

    <text x="18" y="72" class="mono" font-size="9.5" fill="#4C5870" letter-spacing="1.2">MOBILE-FIRST DATA ATLAS · WALKING DEAD UNIVERSE</text>

    <!-- map with pulsing community pins -->
    <rect x="18" y="82" width="228" height="90" rx="8" fill="#161C26" stroke="#2B3648"/>
    <g stroke="#2B3648" stroke-width="1" opacity=".8">
      <path d="M18 106 H246 M18 130 H246 M18 154 H246 M64 82 V172 M118 82 V172 M172 82 V172 M210 82 V172"/>
    </g>
    <g stroke="#4C5870" stroke-width="1.4" fill="none" stroke-dasharray="2 3">
      <path d="M52 100 L96 122 L150 108 L200 140 L226 118"/>
    </g>
    <g>
      <circle class="ring" cx="52" cy="100" r="6" fill="none" stroke="#68D391" stroke-width="1.6"/>
      <circle class="pin"    cx="52" cy="100" r="5" fill="#68D391"/>
      <circle class="pin p2" cx="96" cy="122" r="4.5" fill="#F6AD55"/>
      <circle class="pin p3" cx="150" cy="108" r="4.5" fill="#63B3ED"/>
      <circle class="ring" cx="200" cy="140" r="6" fill="none" stroke="#FC8181" stroke-width="1.6" style="animation-delay:1.3s"/>
      <circle class="pin p4" cx="200" cy="140" r="5.5" fill="#FC8181"/>
      <circle class="pin p2" cx="226" cy="118" r="4" fill="#B794F6"/>
    </g>
    <text x="30" y="164" class="mono" font-size="8" fill="#4C5870">communities · locations · faction control</text>

    <!-- series filter chips -->
    <g class="mono" font-size="8" font-weight="700">
      <rect class="chip"    x="256" y="86"  width="94" height="18" rx="9" fill="#FC8181" fill-opacity=".16" stroke="#FC8181" stroke-opacity=".55"/>
      <text class="chip"    x="303" y="98.5" fill="#FC8181" text-anchor="middle">TWD</text>
      <rect class="chip c2" x="256" y="108" width="94" height="18" rx="9" fill="#F6AD55" fill-opacity=".16" stroke="#F6AD55" stroke-opacity=".55"/>
      <text class="chip c2" x="303" y="120.5" fill="#F6AD55" text-anchor="middle">FEAR THE WD</text>
      <rect class="chip c3" x="256" y="130" width="94" height="18" rx="9" fill="#68D391" fill-opacity=".16" stroke="#68D391" stroke-opacity=".55"/>
      <text class="chip c3" x="303" y="142.5" fill="#68D391" text-anchor="middle">DEAD CITY</text>
    </g>
    <rect x="256" y="152" width="94" height="20" rx="9" fill="#161C26" stroke="#2B3648"/>
    <text x="303" y="165.5" class="mono" font-size="8.5" font-weight="800" fill="#F1F5FB" text-anchor="middle">19 registries</text>

    <!-- universe-year timeline scrubber -->
    <rect x="18" y="180" width="228" height="6" rx="3" fill="#2B3648"/>
    <rect x="18" y="180" width="226" height="6" rx="3" fill="none"/>
    <circle class="scan" cx="18" cy="183" r="5.5" fill="#4FD1C5"/>
    <text x="18" y="199" class="mono" font-size="8" fill="#4C5870">TF1 · outbreak</text>
    <text x="246" y="199" class="mono" font-size="8" fill="#4C5870" text-anchor="end">present day</text>

    <rect y="206" width="380" height="34" fill="#161C26"/><rect y="206" width="380" height="1" fill="#2B3648"/>
    <rect x="17" y="214" width="18" height="18" rx="5" fill="#FC8181"/>
    <text x="26" y="227" class="mono" font-size="10" font-weight="800" fill="#161C26" text-anchor="middle">A</text>
    <text x="42" y="221" font-size="12.5" font-weight="700" fill="#F1F5FB">walking-dead-universe-atlas</text>
    <text x="42" y="233" class="mono" font-size="9" fill="#7C8798">personal build · React + TypeScript · live</text>
    <text class="go" x="362" y="228" font-size="11.5" font-weight="700" fill="#4FD1C5" text-anchor="end">explore ▸</text>
    <rect x=".75" y=".75" width="378.5" height="238.5" rx="12" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
