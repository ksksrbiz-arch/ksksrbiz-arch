<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img" aria-label="precisioncorebuilders.com — Precision Core Builders, custom homes remodels and additions in Eugene Oregon, licensed CCB 246527">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .draw { stroke-dasharray:620; animation:dr 9s ease-in-out infinite; }
    .draw2 { stroke-dasharray:300; animation:dr2 9s ease-in-out infinite; }
    @keyframes dr  { 0%{stroke-dashoffset:620} 40%,88%{stroke-dashoffset:0;opacity:1} 96%,100%{stroke-dashoffset:620;opacity:0} }
    @keyframes dr2 { 0%,30%{stroke-dashoffset:300} 62%,88%{stroke-dashoffset:0;opacity:1} 96%,100%{stroke-dashoffset:300;opacity:0} }
    .rule { animation:ru 9s ease-in-out infinite; }
    @keyframes ru { 0%,100%{opacity:.25} 50%{opacity:.6} }
    .cta { animation:cta 3s ease-in-out infinite; }
    @keyframes cta { 0%,100%{opacity:.85} 50%{opacity:1} }
    .go { animation:go 2.6s ease-in-out infinite; }
    @keyframes go { 0%,100%{opacity:.6} 50%{opacity:1} }
  </style>
  <defs><clipPath id="pc"><rect width="380" height="240" rx="12"/></clipPath></defs>
  <g clip-path="url(#pc)">
    <rect width="380" height="240" fill="#0F131B"/>
    <rect width="380" height="24" fill="#1B2230"/><rect y="23" width="380" height="1" fill="#2B3648"/>
    <circle cx="14" cy="12" r="4" fill="#FF5F57"/><circle cx="28" cy="12" r="4" fill="#FEBC2E"/><circle cx="42" cy="12" r="4" fill="#28C840"/>
    <text x="190" y="16" class="mono" font-size="10.5" fill="#7C8798" text-anchor="middle">precisioncorebuilders.com</text>

    <!-- site header -->
    <rect y="24" width="380" height="30" fill="#161C26"/>
    <path d="M18 44 l7 -9 l7 9 z" fill="#F6AD55"/>
    <text x="38" y="44" font-size="11.5" font-weight="800" fill="#F1F5FB" letter-spacing=".6">PRECISION CORE</text>
    <g class="mono" font-size="8.5" fill="#7C8798">
      <text x="196" y="43">HOMES</text><text x="242" y="43">REMODELS</text><text x="306" y="43">CONTACT</text>
    </g>

    <text x="18" y="72" class="mono" font-size="9.5" fill="#4C5870" letter-spacing="1.2">CUSTOM HOMES · REMODELS · ADDITIONS</text>

    <!-- blueprint house drawing itself -->
    <g class="rule" stroke="#2B3648" stroke-width=".8">
      <path d="M18 90 H274 M18 110 H274 M18 130 H274 M18 150 H274"/>
      <path d="M60 82 V172 M110 82 V172 M160 82 V172 M210 82 V172"/>
    </g>
    <g fill="none" stroke="#4FD1C5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path class="draw" d="M40 168 V112 L146 66 L252 112 V168 Z"/>
    </g>
    <g fill="none" stroke="#F6AD55" stroke-width="1.6" stroke-linecap="round">
      <path class="draw2" d="M76 168 V132 H112 V168 M170 168 V128 H214 V168 M146 66 V96 M40 112 H252"/>
    </g>
    <g class="mono" font-size="7.5" fill="#4FD1C5" opacity=".8">
      <text x="146" y="180" text-anchor="middle">— 42' —</text>
    </g>

    <!-- licence + CTA -->
    <rect x="286" y="82" width="76" height="38" rx="9" fill="#161C26" stroke="#2B3648"/>
    <text x="324" y="99" class="mono" font-size="8.5" fill="#7C8798" text-anchor="middle">LICENSED</text>
    <text x="324" y="112" class="mono" font-size="10" font-weight="800" fill="#68D391" text-anchor="middle">CCB #246527</text>

    <rect class="cta" x="286" y="128" width="76" height="44" rx="9" fill="#4FD1C5"/>
    <text x="324" y="146" class="mono" font-size="8.5" font-weight="800" fill="#0F131B" text-anchor="middle">FREE ON-SITE</text>
    <text x="324" y="159" class="mono" font-size="8.5" font-weight="800" fill="#0F131B" text-anchor="middle">ESTIMATE</text>

    <text x="18" y="196" class="mono" font-size="9" fill="#7C8798">Eugene, OR · 541-852-5144</text>

    <rect y="206" width="380" height="34" fill="#161C26"/><rect y="206" width="380" height="1" fill="#2B3648"/>
    <rect x="17" y="214" width="18" height="18" rx="5" fill="#4FD1C5"/>
    <text x="26" y="227" class="mono" font-size="10" font-weight="800" fill="#0F131B" text-anchor="middle">P</text>
    <text x="42" y="221" font-size="12.5" font-weight="700" fill="#F1F5FB">precisioncorebuilders.com</text>
    <text x="42" y="233" class="mono" font-size="9" fill="#7C8798">client build · React · hosted &amp; deployed</text>
    <text class="go" x="362" y="228" font-size="11.5" font-weight="700" fill="#4FD1C5" text-anchor="end">visit ▸</text>
    <rect x=".75" y=".75" width="378.5" height="238.5" rx="12" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
