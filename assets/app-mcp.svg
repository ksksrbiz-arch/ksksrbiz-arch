<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img" aria-label="onecommerce-mcp-server — live MCP tool-call log: agents invoking orders, products and automation tools over stdio">
  <style>
    text { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .r1{animation:rr 7s steps(1,end) infinite}
    .r2{animation:rr 7s steps(1,end) infinite;animation-delay:1.1s}
    .r3{animation:rr 7s steps(1,end) infinite;animation-delay:2.2s}
    .r4{animation:rr 7s steps(1,end) infinite;animation-delay:3.3s}
    .r5{animation:rr 7s steps(1,end) infinite;animation-delay:4.4s}
    @keyframes rr { 0%{opacity:0} 2%,88%{opacity:1} 92%,100%{opacity:0} }
    .pulse { animation:pl 1.6s ease-in-out infinite; }
    @keyframes pl { 0%,100%{opacity:.35} 50%{opacity:1} }
    .go { animation:go 2.6s ease-in-out infinite; }
    @keyframes go { 0%,100%{opacity:.6} 50%{opacity:1} }
  </style>
  <defs><clipPath id="m"><rect width="380" height="240" rx="12"/></clipPath></defs>
  <g clip-path="url(#m)">
    <rect width="380" height="240" fill="#0F131B"/>
    <rect width="380" height="24" fill="#1B2230"/><rect y="23" width="380" height="1" fill="#2B3648"/>
    <circle cx="14" cy="12" r="4" fill="#FF5F57"/><circle cx="28" cy="12" r="4" fill="#FEBC2E"/><circle cx="42" cy="12" r="4" fill="#28C840"/>
    <text x="190" y="16" font-size="10.5" fill="#7C8798" text-anchor="middle">mcp — stdio transport</text>

    <g font-size="9.5">
      <text x="18" y="43" fill="#4C5870" letter-spacing="1.4">TOOL CALLS</text>
      <rect x="286" y="34" width="76" height="15" rx="7.5" fill="#B794F6" fill-opacity=".14" stroke="#B794F6" stroke-opacity=".45"/>
      <text x="324" y="45" fill="#B794F6" text-anchor="middle">18 tools · v1</text>
    </g>

    <g font-size="10.5">
      <g class="r1">
        <text x="18" y="66" fill="#B794F6">▸</text><text x="32" y="66" fill="#4FD1C5">orders.list</text>
        <text x="126" y="66" fill="#7C8798">store=mtk limit=25</text>
        <text x="330" y="66" fill="#4C5870" text-anchor="end">24ms</text><text x="362" y="66" fill="#68D391" text-anchor="end">✓</text>
      </g>
      <g class="r2">
        <text x="18" y="88" fill="#B794F6">▸</text><text x="32" y="88" fill="#4FD1C5">products.upsert</text>
        <text x="146" y="88" fill="#7C8798">sku=MM-750</text>
        <text x="330" y="88" fill="#4C5870" text-anchor="end">61ms</text><text x="362" y="88" fill="#68D391" text-anchor="end">✓</text>
      </g>
      <g class="r3">
        <text x="18" y="110" fill="#B794F6">▸</text><text x="32" y="110" fill="#4FD1C5">automations.run</text>
        <text x="150" y="110" fill="#7C8798">id=restock</text>
        <text x="330" y="110" fill="#4C5870" text-anchor="end">18ms</text><text x="362" y="110" fill="#68D391" text-anchor="end">✓</text>
      </g>
      <g class="r4">
        <text x="18" y="132" fill="#B794F6">▸</text><text x="32" y="132" fill="#4FD1C5">stores.metrics</text>
        <text x="140" y="132" fill="#7C8798">range=7d</text>
        <text x="330" y="132" fill="#4C5870" text-anchor="end">33ms</text><text x="362" y="132" fill="#68D391" text-anchor="end">✓</text>
      </g>
      <g class="r5">
        <text x="18" y="154" fill="#B794F6">▸</text><text x="32" y="154" fill="#4FD1C5">ai.describe</text>
        <text x="126" y="154" fill="#7C8798">tone=premium</text>
        <text x="330" y="154" fill="#4C5870" text-anchor="end">240ms</text><text x="362" y="154" fill="#68D391" text-anchor="end">✓</text>
      </g>
    </g>

    <rect x="18" y="166" width="344" height="1" fill="#2B3648"/>
    <g font-size="10">
      <circle class="pulse" cx="24" cy="184" r="4" fill="#4FD1C5"/>
      <text x="36" y="188" fill="#7C8798">agent connected</text>
      <text x="362" y="188" fill="#4C5870" text-anchor="end">p95 68ms · 0 errors</text>
    </g>

    <rect y="206" width="380" height="34" fill="#161C26"/><rect y="206" width="380" height="1" fill="#2B3648"/>
    <rect x="17" y="214" width="18" height="18" rx="5" fill="#B794F6"/>
    <text x="26" y="227" font-size="10" font-weight="800" fill="#161C26" text-anchor="middle">M</text>
    <text x="42" y="221" font-size="12.5" font-weight="700" fill="#F1F5FB" font-family="'Segoe UI',Helvetica,Arial,sans-serif">onecommerce-mcp-server</text>
    <text x="42" y="233" font-size="9" fill="#7C8798">Model Context Protocol · TypeScript</text>
    <text class="go" x="362" y="228" font-size="11.5" font-weight="700" fill="#4FD1C5" text-anchor="end">open ▸</text>
    <rect x=".75" y=".75" width="378.5" height="238.5" rx="12" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
