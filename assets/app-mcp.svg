<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" width="380" height="210" role="img" aria-label="onecommerce-mcp-server — MCP server with 18 tools">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .plug { animation: plug 3.2s ease-in-out infinite; }
    @keyframes plug { 0%,100% {transform:translateX(0);} 45%,60% {transform:translateX(14px);} }
    .zap { animation: zap 3.2s steps(1,end) infinite; }
    @keyframes zap { 0%,46% {opacity:0;} 50%,58% {opacity:1;} 62%,100% {opacity:0;} }
    .tool { animation: tool 3.2s ease-in-out infinite; }
    .tool.b{animation-delay:.4s} .tool.c{animation-delay:.8s} .tool.d{animation-delay:1.2s} .tool.e{animation-delay:1.6s} .tool.f{animation-delay:2s}
    @keyframes tool { 0%,100% {opacity:.35;} 50% {opacity:1;} }
    .go { animation: go 2.4s ease-in-out infinite; }
    @keyframes go { 0%,100% {opacity:.6;} 50% {opacity:1;} }
  </style>
  <defs><clipPath id="w2"><rect width="380" height="210" rx="12"/></clipPath></defs>
  <g clip-path="url(#w2)">
    <rect width="380" height="210" fill="#1E1814"/>
    <rect width="380" height="30" fill="#2A211A"/>
    <rect y="29" width="380" height="1" fill="#3A2E24"/>
    <circle cx="18" cy="15" r="5" fill="#FF5F57"/><circle cx="35" cy="15" r="5" fill="#FEBC2E"/><circle cx="52" cy="15" r="5" fill="#28C840"/>
    <text x="190" y="20" font-size="12" fill="#8C8178" text-anchor="middle">MCP Server.app</text>

    <text x="22" y="66" font-size="20" font-weight="800" fill="#F5F0E8">onecommerce-mcp</text>
    <text x="22" y="90" font-size="12.5" fill="#B5AB9F">Model Context Protocol server —</text>
    <text x="22" y="108" font-size="12.5" fill="#B5AB9F">18 Cathedral Framework tools.</text>
    <rect x="22" y="128" width="96" height="22" rx="11" fill="#2A211A" stroke="#3A2E24"/>
    <text x="34" y="143" font-size="11" fill="#B08CD9" font-weight="700">AI · AGENTS</text>
    <text class="go" x="22" y="186" font-size="13" font-weight="700" fill="#E8A33D">Open project ▸</text>

    <!-- motif: agent plug docking into server, tool grid lights up -->
    <g>
      <!-- server socket -->
      <rect x="300" y="84" width="52" height="60" rx="8" fill="#2A211A" stroke="#3A2E24"/>
      <rect x="300" y="104" width="10" height="8" fill="#16110D"/>
      <rect x="300" y="118" width="10" height="8" fill="#16110D"/>
      <!-- plug -->
      <g class="plug">
        <rect x="238" y="100" width="40" height="28" rx="6" fill="#D97757"/>
        <rect x="278" y="105" width="12" height="5" fill="#E8A33D"/>
        <rect x="278" y="118" width="12" height="5" fill="#E8A33D"/>
        <path d="M238 114 H226" stroke="#7A5B49" stroke-width="4" stroke-linecap="round"/>
      </g>
      <path class="zap" d="M296 92 l6 -10 -3 8 6 -2 -8 12 2 -8 z" fill="#E8A33D"/>
      <!-- tool grid -->
      <g>
        <rect class="tool"   x="300" y="156" width="12" height="12" rx="3" fill="#D97757"/>
        <rect class="tool b" x="316" y="156" width="12" height="12" rx="3" fill="#D97757"/>
        <rect class="tool c" x="332" y="156" width="12" height="12" rx="3" fill="#D97757"/>
        <rect class="tool d" x="300" y="172" width="12" height="12" rx="3" fill="#E8A33D"/>
        <rect class="tool e" x="316" y="172" width="12" height="12" rx="3" fill="#E8A33D"/>
        <rect class="tool f" x="332" y="172" width="12" height="12" rx="3" fill="#E8A33D"/>
      </g>
      <text x="296" y="76" font-size="10" fill="#8C8178" font-family="'SFMono-Regular',Consolas,monospace">:mcp/18</text>
    </g>
    <rect x=".75" y=".75" width="378.5" height="208.5" rx="12" fill="none" stroke="#3A2E24" stroke-width="1.5"/>
  </g>
</svg>
