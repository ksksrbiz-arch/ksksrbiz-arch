<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img" aria-label="mojave-run — wasteland arcade driver running: car dodging obstacles on a scrolling desert highway with a live score">
  <style>
    text { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .road { animation:rd .45s linear infinite; }
    @keyframes rd { to { stroke-dashoffset:-40 } }
    .dune { animation:dn 14s linear infinite; }
    @keyframes dn { from{transform:translateX(0)} to{transform:translateX(-190px)} }
    .cac { animation:cc 3.6s linear infinite; }
    .cac2{animation-delay:1.8s}
    @keyframes cc { 0%{transform:translateX(0);opacity:0} 4%{opacity:1} 96%{opacity:1} 100%{transform:translateX(-340px);opacity:0} }
    .ob1 { animation:o1 5.4s linear infinite; }
    .ob2 { animation:o2 5.4s linear infinite; }
    @keyframes o1 { 0%{transform:translateX(0);opacity:0} 3%{opacity:1} 97%{opacity:1} 100%{transform:translateX(-350px);opacity:0} }
    @keyframes o2 { 0%,50%{transform:translateX(0);opacity:0} 53%{opacity:1} 97%{opacity:1} 100%{transform:translateX(-350px);opacity:0} }
    .lane { animation:ln 5.4s steps(1,end) infinite; }
    @keyframes ln { 0%,26%{transform:translateY(0)} 30%,74%{transform:translateY(-26px)} 78%,100%{transform:translateY(0)} }
    .bob { animation:bb 1.1s ease-in-out infinite; }
    @keyframes bb { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.6px)} }
    .dust { animation:ds 1s ease-out infinite; }
    .dust2{animation-delay:.33s}.dust3{animation-delay:.66s}
    @keyframes ds { 0%{transform:translateX(0);opacity:.7} 100%{transform:translateX(-26px);opacity:0} }
    .s1{animation:sa 5.4s steps(1,end) infinite}
    .s2{animation:sb 5.4s steps(1,end) infinite}
    .s3{animation:sc 5.4s steps(1,end) infinite}
    @keyframes sa { 0%,32%{opacity:1} 33%,100%{opacity:0} }
    @keyframes sb { 0%,32%{opacity:0} 33%,65%{opacity:1} 66%,100%{opacity:0} }
    @keyframes sc { 0%,65%{opacity:0} 66%,100%{opacity:1} }
    .go { animation:go 2.6s ease-in-out infinite; }
    @keyframes go { 0%,100%{opacity:.6} 50%{opacity:1} }
  </style>
  <defs>
    <clipPath id="j"><rect width="380" height="240" rx="12"/></clipPath>
    <clipPath id="field"><rect y="24" width="380" height="182"/></clipPath>
    <linearGradient id="dsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141B2E"/><stop offset="1" stop-color="#5B2E4A"/></linearGradient>
  </defs>
  <g clip-path="url(#j)">
    <rect width="380" height="240" fill="#0F131B"/>
    <g clip-path="url(#field)">
      <rect y="24" width="380" height="182" fill="url(#dsky)"/>
      <circle cx="286" cy="92" r="26" fill="#F6AD55"/>
      <rect x="256" y="86" width="60" height="3" fill="#141B2E" opacity=".65"/>
      <rect x="256" y="94" width="60" height="4" fill="#141B2E" opacity=".65"/>
      <g class="dune" opacity=".55">
        <path d="M0 118 L44 100 L92 116 L140 98 L190 118 L234 100 L282 116 L330 98 L380 118 L380 132 L0 132 Z" fill="#3B2540"/>
        <path d="M190 118 L234 100 L282 116 L330 98 L380 118 L424 100 L472 116 L520 98 L570 118 L570 132 L190 132 Z" fill="#3B2540"/>
      </g>
      <g class="cac" fill="#4F9E7B">
        <rect x="384" y="112" width="6" height="22" rx="3"/><rect x="379" y="118" width="5" height="9" rx="2.5"/>
      </g>
      <g class="cac cac2" fill="#4F9E7B">
        <rect x="384" y="116" width="6" height="18" rx="3"/><rect x="390" y="121" width="5" height="8" rx="2.5"/>
      </g>

      <rect y="132" width="380" height="74" fill="#2B1E38"/>
      <path class="road" d="M0 152 H380" stroke="#F6AD55" stroke-width="3.5" stroke-dasharray="22 18" fill="none" opacity=".8"/>
      <path class="road" d="M0 186 H380" stroke="#F6AD55" stroke-width="3.5" stroke-dasharray="22 18" fill="none" opacity=".8" style="animation-delay:.2s"/>

      <g class="ob1"><rect x="384" y="164" width="30" height="16" rx="4" fill="#7C8798"/><rect x="390" y="158" width="18" height="8" rx="2" fill="#4C5870"/></g>
      <g class="ob2"><path d="M384 136 h30 l-5 16 h-20 z" fill="#8B5E3C"/><circle cx="399" cy="133" r="6" fill="#4F9E7B"/></g>

      <g class="lane">
        <g class="bob" transform="translate(0,26)">
          <path d="M96 140 l8 -10 h22 l8 10 z" fill="#B794F6"/>
          <rect x="88" y="139" width="54" height="12" rx="5" fill="#4FD1C5"/>
          <rect x="100" y="132" width="22" height="7" rx="2" fill="#0F131B" opacity=".55"/>
          <circle cx="102" cy="152" r="5" fill="#0F131B" stroke="#9AA6B8" stroke-width="1.4"/>
          <circle cx="128" cy="152" r="5" fill="#0F131B" stroke="#9AA6B8" stroke-width="1.4"/>
          <circle class="dust"  cx="84" cy="150" r="3" fill="#7C8798"/>
          <circle class="dust dust2" cx="82" cy="145" r="2.2" fill="#7C8798"/>
          <circle class="dust dust3" cx="85" cy="153" r="1.8" fill="#7C8798"/>
        </g>
      </g>
    </g>

    <rect width="380" height="24" fill="#1B2230"/><rect y="23" width="380" height="1" fill="#2B3648"/>
    <circle cx="14" cy="12" r="4" fill="#FF5F57"/><circle cx="28" cy="12" r="4" fill="#FEBC2E"/><circle cx="42" cy="12" r="4" fill="#28C840"/>
    <text x="190" y="16" font-size="10.5" fill="#7C8798" text-anchor="middle">mojave-run — 60 fps</text>

    <g font-size="11" font-weight="700">
      <text x="18" y="46" fill="#F1F5FB">SCORE <tspan fill="#F6AD55"><tspan class="s1">04120</tspan><tspan class="s2" x="66">07340</tspan><tspan class="s3" x="66">09980</tspan></tspan></text>
      <text x="362" y="46" fill="#FC8181" text-anchor="end">♥ ♥ ♥</text>
    </g>
    <text x="362" y="200" font-size="9" fill="#F1F5FB" text-anchor="end" opacity=".7">survive the mojave</text>

    <rect y="206" width="380" height="34" fill="#161C26"/><rect y="206" width="380" height="1" fill="#2B3648"/>
    <rect x="17" y="214" width="18" height="18" rx="5" fill="#F6E05E"/>
    <text x="26" y="227" font-size="9.5" font-weight="800" fill="#161C26" text-anchor="middle">JS</text>
    <text x="42" y="221" font-size="12.5" font-weight="700" fill="#F1F5FB" font-family="'Segoe UI',Helvetica,Arial,sans-serif">mojave-run</text>
    <text x="42" y="233" font-size="9" fill="#7C8798">browser arcade driver · side-quest</text>
    <text class="go" x="362" y="228" font-size="11.5" font-weight="700" fill="#4FD1C5" text-anchor="end">insert coin ▸</text>
    <rect x=".75" y=".75" width="378.5" height="238.5" rx="12" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
