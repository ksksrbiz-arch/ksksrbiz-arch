<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 72" width="1200" height="72" role="img" aria-label="Side quests and personal projects — everything below this line is built for fun, not for clients">
  <style>
    text { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .dash { stroke-dasharray:6 8; animation:dd 1.6s linear infinite; }
    @keyframes dd { to { stroke-dashoffset:-14 } }
    .blip { animation:bl 3s ease-in-out infinite; }
    .b2{animation-delay:.6s}.b3{animation-delay:1.2s}.b4{animation-delay:1.8s}.b5{animation-delay:2.4s}
    @keyframes bl { 0%,100%{opacity:.2} 50%{opacity:.9} }
    .coin { animation:cn 2.2s steps(1,end) infinite; }
    @keyframes cn { 0%,49%{opacity:1} 50%,100%{opacity:.3} }
  </style>
  <g>
    <path class="dash" d="M24 36 H470" stroke="#2B3648" stroke-width="1.6" fill="none"/>
    <path class="dash" d="M730 36 H1176" stroke="#2B3648" stroke-width="1.6" fill="none"/>
    <g fill="#B794F6">
      <circle class="blip"    cx="120" cy="36" r="2.5"/>
      <circle class="blip b2" cx="250" cy="36" r="2.5" fill="#4FD1C5"/>
      <circle class="blip b3" cx="380" cy="36" r="2.5" fill="#F6AD55"/>
      <circle class="blip b4" cx="880" cy="36" r="2.5" fill="#4FD1C5"/>
      <circle class="blip b5" cx="1030" cy="36" r="2.5" fill="#68D391"/>
    </g>
    <rect x="482" y="20" width="236" height="32" rx="16" fill="#161C26" stroke="#B794F6" stroke-opacity=".45"/>
    <text x="600" y="40" font-size="12" fill="#B794F6" text-anchor="middle" letter-spacing="2.5" font-weight="700">
      <tspan class="coin">◆</tspan> SIDE QUESTS <tspan class="coin">◆</tspan>
    </text>
    <text x="600" y="64" font-size="10" fill="#4C5870" text-anchor="middle" letter-spacing="1.2">built for fun, not for clients</text>
  </g>
</svg>
