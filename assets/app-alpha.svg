<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" width="380" height="210" role="img" aria-label="prediction-alpha-engine — prediction market alpha engine">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .c1{animation:cnd 4s ease-in-out infinite}
    .c2{animation:cnd 4s ease-in-out infinite;animation-delay:.5s}
    .c3{animation:cnd 4s ease-in-out infinite;animation-delay:1s}
    .c4{animation:cnd 4s ease-in-out infinite;animation-delay:1.5s}
    .c5{animation:cnd 4s ease-in-out infinite;animation-delay:2s}
    @keyframes cnd { 0%,100% {opacity:.5;} 50% {opacity:1;} }
    .trend { stroke-dasharray: 260; animation: tr 5s ease-in-out infinite; }
    @keyframes tr { 0% {stroke-dashoffset:260;} 60%,88% {stroke-dashoffset:0; opacity:1;} 96%,100% {stroke-dashoffset:260; opacity:0;} }
    .sig { animation: sig 5s steps(1,end) infinite; }
    @keyframes sig { 0%,58% {opacity:0;} 62%,88% {opacity:1;} 92%,100% {opacity:0;} }
    .go { animation: go 2.4s ease-in-out infinite; }
    @keyframes go { 0%,100% {opacity:.6;} 50% {opacity:1;} }
  </style>
  <defs><clipPath id="w3"><rect width="380" height="210" rx="12"/></clipPath></defs>
  <g clip-path="url(#w3)">
    <rect width="380" height="210" fill="#161C26"/>
    <rect width="380" height="30" fill="#1B2230"/>
    <rect y="29" width="380" height="1" fill="#2B3648"/>
    <circle cx="18" cy="15" r="5" fill="#FF5F57"/><circle cx="35" cy="15" r="5" fill="#FEBC2E"/><circle cx="52" cy="15" r="5" fill="#28C840"/>
    <text x="190" y="20" font-size="12" fill="#7C8798" text-anchor="middle">Alpha Engine.app</text>

    <text x="22" y="66" font-size="20" font-weight="800" fill="#F1F5FB">alpha-engine</text>
    <text x="22" y="90" font-size="12.5" fill="#9AA6B8">Kalshi / Polymarket ingestion,</text>
    <text x="22" y="108" font-size="12.5" fill="#9AA6B8">ML edge scoring, agentic automation.</text>
    <rect x="22" y="128" width="76" height="22" rx="11" fill="#1B2230" stroke="#2B3648"/>
    <text x="34" y="143" font-size="11" fill="#63B3ED" font-weight="700">PYTHON</text>
    <text class="go" x="22" y="186" font-size="13" font-weight="700" fill="#F6AD55">Open project ▸</text>

    <!-- motif: candlesticks + edge line + signal -->
    <g>
      <g stroke-width="2">
        <g class="c1"><line x1="240" y1="70" x2="240" y2="130" stroke="#68D391"/><rect x="234" y="86" width="12" height="30" rx="2" fill="#68D391"/></g>
        <g class="c2"><line x1="266" y1="80" x2="266" y2="140" stroke="#B794F6"/><rect x="260" y="96" width="12" height="28" rx="2" fill="#B794F6"/></g>
        <g class="c3"><line x1="292" y1="64" x2="292" y2="126" stroke="#68D391"/><rect x="286" y="76" width="12" height="34" rx="2" fill="#68D391"/></g>
        <g class="c4"><line x1="318" y1="58" x2="318" y2="116" stroke="#68D391"/><rect x="312" y="68" width="12" height="30" rx="2" fill="#68D391"/></g>
        <g class="c5"><line x1="344" y1="48" x2="344" y2="108" stroke="#68D391"/><rect x="338" y="58" width="12" height="28" rx="2" fill="#68D391"/></g>
      </g>
      <path class="trend" d="M230 138 C260 130 270 112 296 100 S334 68 356 58" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round"/>
      <g class="sig">
        <rect x="296" y="150" width="64" height="22" rx="11" fill="#68D391"/>
        <text x="328" y="165" font-size="11" font-weight="800" fill="#0F131B" text-anchor="middle">EDGE +7%</text>
      </g>
      <text x="232" y="180" font-size="10" fill="#7C8798" font-family="'SFMono-Regular',Consolas,monospace">kalshi·poly</text>
    </g>
    <rect x=".75" y=".75" width="378.5" height="208.5" rx="12" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
