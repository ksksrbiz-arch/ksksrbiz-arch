<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img" aria-label="prediction-alpha-engine — live market chart with model edge scoring: candlesticks, fair-value line and a fired BUY signal">
  <style>
    text { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .c { animation:cd 6s ease-in-out infinite; }
    .c2{animation-delay:.3s}.c3{animation-delay:.6s}.c4{animation-delay:.9s}
    .c5{animation-delay:1.2s}.c6{animation-delay:1.5s}.c7{animation-delay:1.8s}
    @keyframes cd { 0%,100%{opacity:.55} 50%{opacity:1} }
    .fair { stroke-dasharray:300; animation:fr 6s ease-in-out infinite; }
    @keyframes fr { 0%{stroke-dashoffset:300} 45%,85%{stroke-dashoffset:0;opacity:1} 95%,100%{opacity:0;stroke-dashoffset:300} }
    .sig { animation:sg 6s steps(1,end) infinite; }
    @keyframes sg { 0%,52%{opacity:0} 56%,88%{opacity:1} 92%,100%{opacity:0} }
    .scan { animation:sc 6s ease-in-out infinite; }
    @keyframes sc { 0%{transform:translateX(0)} 45%,100%{transform:translateX(268px)} }
    .go { animation:go 2.6s ease-in-out infinite; }
    @keyframes go { 0%,100%{opacity:.6} 50%{opacity:1} }
  </style>
  <defs><clipPath id="a"><rect width="380" height="240" rx="12"/></clipPath></defs>
  <g clip-path="url(#a)">
    <rect width="380" height="240" fill="#0F131B"/>
    <rect width="380" height="24" fill="#1B2230"/><rect y="23" width="380" height="1" fill="#2B3648"/>
    <circle cx="14" cy="12" r="4" fill="#FF5F57"/><circle cx="28" cy="12" r="4" fill="#FEBC2E"/><circle cx="42" cy="12" r="4" fill="#28C840"/>
    <text x="190" y="16" font-size="10.5" fill="#7C8798" text-anchor="middle">alpha-engine — KALSHI:PRES-24</text>

    <g font-size="9.5">
      <text x="18" y="43" fill="#4C5870" letter-spacing="1.4">MODEL vs MARKET</text>
      <text x="362" y="43" fill="#B794F6" text-anchor="end">edge score 0.71</text>
    </g>

    <g stroke="#1B2230" stroke-width="1">
      <path d="M18 62 H362 M18 96 H362 M18 130 H362 M18 164 H362"/>
    </g>
    <g font-size="8" fill="#3C4658">
      <text x="366" y="65">.70</text><text x="366" y="99">.60</text><text x="366" y="133">.50</text><text x="366" y="167">.40</text>
    </g>

    <g stroke-width="2.2">
      <g class="c">   <line x1="40"  y1="150" x2="40"  y2="178" stroke="#68D391"/><rect x="35"  y="156" width="10" height="18" rx="2" fill="#68D391"/></g>
      <g class="c c2"><line x1="76"  y1="132" x2="76"  y2="166" stroke="#FC8181"/><rect x="71"  y="142" width="10" height="18" rx="2" fill="#FC8181"/></g>
      <g class="c c3"><line x1="112" y1="120" x2="112" y2="156" stroke="#68D391"/><rect x="107" y="126" width="10" height="22" rx="2" fill="#68D391"/></g>
      <g class="c c4"><line x1="148" y1="104" x2="148" y2="140" stroke="#68D391"/><rect x="143" y="110" width="10" height="22" rx="2" fill="#68D391"/></g>
      <g class="c c5"><line x1="184" y1="110" x2="184" y2="142" stroke="#FC8181"/><rect x="179" y="118" width="10" height="18" rx="2" fill="#FC8181"/></g>
      <g class="c c6"><line x1="220" y1="86"  x2="220" y2="124" stroke="#68D391"/><rect x="215" y="92"  width="10" height="24" rx="2" fill="#68D391"/></g>
      <g class="c c7"><line x1="256" y1="70"  x2="256" y2="108" stroke="#68D391"/><rect x="251" y="76"  width="10" height="24" rx="2" fill="#68D391"/></g>
    </g>

    <path class="fair" d="M30 168 C70 158 96 140 130 126 S196 106 224 92 S262 76 290 68" fill="none" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round"/>
    <rect class="scan" x="28" y="56" width="2" height="122" fill="#4FD1C5" opacity=".35"/>

    <g class="sig">
      <rect x="278" y="118" width="80" height="40" rx="9" fill="#68D391" fill-opacity=".14" stroke="#68D391" stroke-opacity=".65"/>
      <text x="318" y="136" font-size="12.5" font-weight="800" fill="#68D391" text-anchor="middle">BUY YES</text>
      <text x="318" y="150" font-size="9" fill="#7C8798" text-anchor="middle">+7.2% edge</text>
    </g>

    <g font-size="9.5">
      <text x="18" y="196" fill="#7C8798">kalshi · polymarket</text>
      <text x="362" y="196" fill="#4C5870" text-anchor="end">ingest 1.2k mkts/min</text>
    </g>

    <rect y="206" width="380" height="34" fill="#161C26"/><rect y="206" width="380" height="1" fill="#2B3648"/>
    <rect x="17" y="214" width="18" height="18" rx="5" fill="#63B3ED"/>
    <text x="26" y="227" font-size="9.5" font-weight="800" fill="#161C26" text-anchor="middle">PY</text>
    <text x="42" y="221" font-size="12.5" font-weight="700" fill="#F1F5FB" font-family="'Segoe UI',Helvetica,Arial,sans-serif">prediction-alpha-engine</text>
    <text x="42" y="233" font-size="9" fill="#7C8798">ML edge scoring · agentic automation</text>
    <text class="go" x="362" y="228" font-size="11.5" font-weight="700" fill="#4FD1C5" text-anchor="end">open ▸</text>
    <rect x=".75" y=".75" width="378.5" height="238.5" rx="12" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
