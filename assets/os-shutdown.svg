<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Thanks for visiting — 1COMMERCE OS stays online">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .ring { animation: ring 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    @keyframes ring { 0%,100% {opacity:.35; transform:scale(1);} 50% {opacity:1; transform:scale(1.08);} }
    .halo { animation: halo 2.6s ease-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    @keyframes halo { 0% {opacity:.5; transform:scale(.8);} 100% {opacity:0; transform:scale(1.9);} }
    .tick { animation: tick 2s steps(1,end) infinite; }
    @keyframes tick { 0%,49% {opacity:1;} 50%,100% {opacity:.25;} }
    /* rare CRT power flicker — blink to black with a collapse line, then back */
    .flicker { animation: flick 11s steps(1,end) infinite; }
    @keyframes flick { 0%,90% {opacity:0;} 90.5%,91.5% {opacity:1;} 92%,100% {opacity:0;} }
    .flickline { animation: flickline 11s steps(1,end) infinite; }
    @keyframes flickline { 0%,90.5% {opacity:0;} 91%,91.5% {opacity:1;} 92%,100% {opacity:0;} }
  </style>
  <defs>
    <linearGradient id="fgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#161C26"/>
      <stop offset=".55" stop-color="#20284A"/>
      <stop offset="1" stop-color="#1E2A4A"/>
    </linearGradient>
    <clipPath id="fclip"><rect width="1200" height="110" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#fclip)">
    <rect width="1200" height="110" fill="url(#fgrad)"/>
    <!-- power button -->
    <circle class="halo" cx="80" cy="55" r="26" fill="none" stroke="#4FD1C5" stroke-width="2"/>
    <g class="ring">
      <circle cx="80" cy="55" r="24" fill="#161C26" stroke="#4FD1C5" stroke-width="2.5"/>
      <path d="M80 41 v14" stroke="#4FD1C5" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M69 49 a15 15 0 1 0 22 0" fill="none" stroke="#4FD1C5" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="126" y="49" font-size="20" font-weight="700" fill="#F1F5FB">Thanks for visiting.</text>
    <text x="126" y="76" font-size="14" fill="#E2E8F0" opacity=".8">1COMMERCE OS stays online — new builds ship weekly.</text>
    <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="13" text-anchor="end">
      <text x="1160" y="50" fill="#F1F5FB" opacity=".9">do not power off <tspan class="tick" fill="#F6AD55">▌</tspan></text>
      <text x="1160" y="74" fill="#E2E8F0" opacity=".6">uptime: ∞ · built with claude code</text>
    </g>
    <!-- CRT flicker: someone keeps touching the power button -->
    <rect class="flicker" width="1200" height="110" fill="#080B10"/>
    <rect class="flickline" x="0" y="53" width="1200" height="3" fill="#F1F5FB" opacity="0"/>
  </g>
</svg>
