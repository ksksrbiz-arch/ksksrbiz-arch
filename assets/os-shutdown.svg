<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="Got a project? Email skdev@1commerce.online. Design, build, hosting and maintenance from the Pacific Northwest, working with clients anywhere. Usually replies the same day.">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .ring { transform-box:fill-box; transform-origin:50% 50%; animation:ring 2.8s ease-in-out infinite; }
    @keyframes ring { 0%,100%{opacity:.4;transform:scale(1)} 50%{opacity:1;transform:scale(1.06)} }
    .halo { transform-box:fill-box; transform-origin:50% 50%; animation:halo 2.8s ease-out infinite; }
    @keyframes halo { 0%{opacity:.5;transform:scale(.85)} 100%{opacity:0;transform:scale(1.9)} }
    .cta { animation:cta 3.4s ease-in-out infinite; }
    @keyframes cta { 0%,100%{opacity:.9} 50%{opacity:1} }
    .arr { animation:arr 2s ease-in-out infinite; }
    @keyframes arr { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
  </style>
  <defs>
    <clipPath id="sd"><rect width="1200" height="130" rx="14"/></clipPath>
    <linearGradient id="sdg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F131B"/><stop offset=".6" stop-color="#16202E"/><stop offset="1" stop-color="#1B3040"/>
    </linearGradient>
    <linearGradient id="sdb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD1C5"/><stop offset="1" stop-color="#68D391"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#sd)">
    <rect width="1200" height="130" fill="url(#sdg)"/>

    <circle class="halo" cx="72" cy="65" r="26" fill="none" stroke="#4FD1C5" stroke-width="2"/>
    <g class="ring">
      <circle cx="72" cy="65" r="24" fill="#0F131B" stroke="#4FD1C5" stroke-width="2.5"/>
      <path d="M72 51 v14" stroke="#4FD1C5" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M61 59 a15 15 0 1 0 22 0" fill="none" stroke="#4FD1C5" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <text x="118" y="56" font-size="22" font-weight="800" fill="#F1F5FB">Got a project?</text>
    <text x="118" y="82" font-size="13.5" fill="#9AA6B8">Design, build, hosting and maintenance — Pacific Northwest, clients anywhere.</text>
    <text x="118" y="104" class="mono" font-size="11.5" fill="#4C5870">usually replies the same day · no obligation, no sales script</text>

    <rect class="cta" x="836" y="42" width="340" height="46" rx="23" fill="url(#sdb)"/>
    <text x="990" y="71" class="mono" font-size="15" font-weight="800" fill="#0F131B" text-anchor="middle">skdev@1commerce.online</text>
    <g class="arr"><text x="1148" y="71" class="mono" font-size="16" font-weight="800" fill="#0F131B">›</text></g>

    <text x="1176" y="112" class="mono" font-size="10.5" fill="#4C5870" text-anchor="end">1COMMERCE OS · built with claude code</text>
    <rect x=".75" y=".75" width="1198.5" height="128.5" rx="14" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
