<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Start a project — get in touch at skdev@1commerce.online. Tell me what you need, your timeline, a rough budget and sites you like; you get a reply within a day, a free call and a fixed quote, then a build with a live preview link. Pacific Northwest, working with clients anywhere.">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .cta { animation:cta 3.4s ease-in-out infinite; }
    @keyframes cta { 0%,100%{opacity:.9} 50%{opacity:1} }
    .halo { transform-box:fill-box; transform-origin:50% 50%; animation:halo 3.4s ease-out infinite; }
    @keyframes halo { 0%{opacity:.5;transform:scale(.98)} 70%,100%{opacity:0;transform:scale(1.06)} }
    .cur { animation:cur 6s ease-in-out infinite; }
    @keyframes cur {
      0%,18%{transform:translate(560px,232px);opacity:0}
      24%{opacity:1} 52%{transform:translate(232px,196px);opacity:1}
      58%{transform:translate(232px,199px)} 64%{transform:translate(232px,196px)}
      88%{transform:translate(232px,196px);opacity:1} 94%,100%{opacity:0}
    }
    .press { animation:press 6s steps(1,end) infinite; }
    @keyframes press { 0%,56%{opacity:0} 57%,63%{opacity:1} 64%,100%{opacity:0} }
    .tick { animation:tk 4.4s ease-in-out infinite; }
    .t2{animation-delay:.35s}.t3{animation-delay:.7s}.t4{animation-delay:1.05s}
    @keyframes tk { 0%,100%{opacity:.45} 50%{opacity:1} }
    .step { animation:st 5.4s ease-in-out infinite; }
    .s2{animation-delay:1.1s}.s3{animation-delay:2.2s}
    @keyframes st { 0%,100%{stroke-opacity:.3} 50%{stroke-opacity:.95} }
    .caret { animation:bl 1.05s steps(1,end) infinite; }
    @keyframes bl { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>
  <defs>
    <clipPath id="ct"><rect width="1200" height="300" rx="14"/></clipPath>
    <linearGradient id="ctag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD1C5"/><stop offset="1" stop-color="#68D391"/>
    </linearGradient>
    <radialGradient id="glowc" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4FD1C5" stop-opacity=".22"/><stop offset="1" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#ct)">
    <rect width="1200" height="300" fill="#0F131B"/>
    <ellipse cx="250" cy="180" rx="300" ry="150" fill="url(#glowc)"/>

    <rect width="1200" height="34" fill="#1B2230"/>
    <rect y="33" width="1200" height="1" fill="#2B3648"/>
    <circle cx="22" cy="17" r="6" fill="#FF5F57"/><circle cx="42" cy="17" r="6" fill="#FEBC2E"/><circle cx="62" cy="17" r="6" fill="#28C840"/>
    <text x="600" y="22" class="mono" font-size="13" fill="#7C8798" text-anchor="middle">start-a-project.app — new enquiry</text>

    <!-- left: the ask -->
    <text x="40" y="76" class="mono" font-size="10.5" fill="#4C5870" letter-spacing="1.8">START A PROJECT</text>
    <text x="40" y="112" font-size="27" font-weight="800" fill="#F1F5FB">Need a site built,</text>
    <text x="40" y="144" font-size="27" font-weight="800" fill="#4FD1C5">hosted and looked after?</text>
    <text x="40" y="172" font-size="13.5" fill="#9AA6B8">Design, build, launch and ongoing care — one person, start to finish.</text>

    <rect class="halo" x="40" y="186" width="384" height="46" rx="23" fill="none" stroke="#4FD1C5" stroke-width="1.5"/>
    <rect class="cta" x="40" y="186" width="384" height="46" rx="23" fill="url(#ctag)"/>
    <rect class="press" x="40" y="186" width="384" height="46" rx="23" fill="#2E6B75"/>
    <text x="232" y="215" class="mono" font-size="16" font-weight="800" fill="#0F131B" text-anchor="middle">skdev@1commerce.online</text>

    <text x="40" y="252" class="mono" font-size="11.5" fill="#7C8798">or reply on any channel below <tspan class="caret" fill="#4FD1C5">▌</tspan></text>

    <!-- middle: what to include -->
    <rect x="500" y="58" width="1" height="182" fill="#2B3648"/>
    <text x="536" y="76" class="mono" font-size="10.5" fill="#4C5870" letter-spacing="1.8">HELPFUL TO INCLUDE</text>
    <g font-size="13.5" fill="#E2E8F0">
      <g class="tick">   <path d="M536 100 l5 5 9 -11" fill="none" stroke="#68D391" stroke-width="2.2" stroke-linecap="round"/><text x="562" y="105">what the site needs to do</text></g>
      <g class="tick t2"><path d="M536 130 l5 5 9 -11" fill="none" stroke="#68D391" stroke-width="2.2" stroke-linecap="round"/><text x="562" y="135">rough timeline</text></g>
      <g class="tick t3"><path d="M536 160 l5 5 9 -11" fill="none" stroke="#68D391" stroke-width="2.2" stroke-linecap="round"/><text x="562" y="165">budget range, even loose</text></g>
      <g class="tick t4"><path d="M536 190 l5 5 9 -11" fill="none" stroke="#68D391" stroke-width="2.2" stroke-linecap="round"/><text x="562" y="195">a site or two you like</text></g>
    </g>
    <text x="536" y="226" class="mono" font-size="11" fill="#4C5870">no brief yet? we'll work it out.</text>

    <!-- right: what happens next -->
    <rect x="828" y="58" width="1" height="182" fill="#2B3648"/>
    <text x="864" y="76" class="mono" font-size="10.5" fill="#4C5870" letter-spacing="1.8">WHAT HAPPENS NEXT</text>
    <g>
      <circle class="step" cx="878" cy="100" r="12" fill="#161C26" stroke="#4FD1C5" stroke-width="1.8"/>
      <text x="878" y="105" class="mono" font-size="12" font-weight="800" fill="#4FD1C5" text-anchor="middle">1</text>
      <text x="902" y="98" font-size="13.5" font-weight="700" fill="#F1F5FB">I reply, usually same day</text>
      <text x="902" y="114" class="mono" font-size="11" fill="#7C8798">a real person, not a form robot</text>

      <circle class="step s2" cx="878" cy="150" r="12" fill="#161C26" stroke="#4FD1C5" stroke-width="1.8"/>
      <text x="878" y="155" class="mono" font-size="12" font-weight="800" fill="#4FD1C5" text-anchor="middle">2</text>
      <text x="902" y="148" font-size="13.5" font-weight="700" fill="#F1F5FB">Free call, then a fixed quote</text>
      <text x="902" y="164" class="mono" font-size="11" fill="#7C8798">scope and price agreed up front</text>

      <circle class="step s3" cx="878" cy="200" r="12" fill="#161C26" stroke="#4FD1C5" stroke-width="1.8"/>
      <text x="878" y="205" class="mono" font-size="12" font-weight="800" fill="#4FD1C5" text-anchor="middle">3</text>
      <text x="902" y="198" font-size="13.5" font-weight="700" fill="#F1F5FB">Build with a live preview</text>
      <text x="902" y="214" class="mono" font-size="11" fill="#7C8798">watch it come together, not a big reveal</text>
    </g>

    <g class="cur"><path d="M0 0 L0 17 L4.9 13.4 L8.5 20.6 L11.3 19.2 L13.4 11.7 L7.6 12.1 Z" fill="#F1F5FB" stroke="#0F131B" stroke-width="1.2"/></g>

    <rect y="266" width="1200" height="34" fill="#1B2230"/>
    <rect y="266" width="1200" height="1" fill="#2B3648"/>
    <circle cx="40" cy="283" r="4.5" fill="#68D391"/>
    <text x="56" y="288" class="mono" font-size="11.5" fill="#7C8798">available for new work · Pacific Northwest · working with clients anywhere</text>
    <text x="1176" y="288" class="mono" font-size="11.5" font-weight="700" fill="#4FD1C5" text-anchor="end">skdev@1commerce.online ▸</text>

    <rect x=".75" y=".75" width="1198.5" height="298.5" rx="14" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
