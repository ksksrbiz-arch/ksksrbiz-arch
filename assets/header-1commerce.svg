<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="1COMMERCE animated header">
  <style>
    .word   { animation: shimmer 6s ease-in-out infinite; }
    .spark  { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .spark.b { animation-delay: 1.5s; }
    /* flowing waves drifting in opposite directions; one full 300px period each loop = seamless */
    .wave1  { animation: wv1 8s linear infinite; }
    .wave2  { animation: wv2 12s linear infinite; }

    @keyframes shimmer { 0%,100% { opacity:.92; } 50% { opacity:1; } }
    @keyframes twinkle { 0%,100% { opacity:.2; transform: scale(.7);} 50% { opacity:1; transform: scale(1);} }
    @keyframes wv1     { from { transform: translateX(0); } to { transform: translateX(-300px); } }
    @keyframes wv2     { from { transform: translateX(-300px); } to { transform: translateX(0); } }
  </style>

  <defs>
    <!-- Repeating, symmetric warm brand gradient. One 600u period repeats seamlessly;
         a SMIL translate of exactly one period gives perfectly fluid, snap-free motion. -->
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0.00" stop-color="#1E1814"/>
      <stop offset="0.16" stop-color="#7A2E1E"/>
      <stop offset="0.34" stop-color="#C25B3C"/>
      <stop offset="0.50" stop-color="#E8A33D"/>
      <stop offset="0.66" stop-color="#C25B3C"/>
      <stop offset="0.84" stop-color="#7A2E1E"/>
      <stop offset="1.00" stop-color="#1E1814"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="0 0" to="600 0" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="200"/></clipPath>
  </defs>

  <!-- animated warm brand background -->
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="200" fill="url(#brand)"/>
    <!-- subtle darkening for legibility -->
    <rect x="0" y="0" width="1200" height="200" fill="#000000" opacity="0.18"/>
  </g>

  <!-- sparkles -->
  <g fill="#FBEFE3">
    <path class="spark a" d="M150 56 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z"/>
    <path class="spark b" d="M1040 120 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
  </g>

  <!-- wordmark -->
  <g class="word" font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="108" font-size="78" font-weight="800" letter-spacing="10" fill="#FFFFFF"
          style="paint-order:stroke" stroke="#000000" stroke-opacity="0.18" stroke-width="2">1COMMERCE</text>
    <text x="600" y="150" font-size="22" font-weight="600" letter-spacing="7" fill="#F5F0E8" opacity="0.95">COMMERCE · SIMPLIFIED</text>
  </g>

  <!-- flowing coral waves (drift in opposite directions); 1800 wide w/ 300px period for seamless looping -->
  <g>
    <path class="wave2" fill="#C25B3C" opacity="0.6"
      d="M-300,214 q75,-18 150,0 q75,18 150,0 q75,-18 150,0 q75,18 150,0 q75,-18 150,0 q75,18 150,0 q75,-18 150,0 q75,18 150,0 q75,-18 150,0 q75,18 150,0 q75,-18 150,0 q75,18 150,0 L1500,260 L-300,260 Z"/>
    <path class="wave1" fill="#D97757"
      d="M-300,200 q75,-20 150,0 q75,20 150,0 q75,-20 150,0 q75,20 150,0 q75,-20 150,0 q75,20 150,0 q75,-20 150,0 q75,20 150,0 q75,-20 150,0 q75,20 150,0 q75,-20 150,0 q75,20 150,0 L1500,260 L-300,260 Z"/>
  </g>
</svg>
