<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="1COMMERCE OS menu bar: Finder, File, Build, Ship, Automate; available for new work, Pacific Northwest UTC minus 7, and skdev@1commerce.online">
  <style>
    text { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .colon { animation:bl 2s steps(1,end) infinite; }
    @keyframes bl { 0%,49%{opacity:1} 50%,100%{opacity:.15} }
    .eq { transform-box:fill-box; transform-origin:50% 100%; animation:eq 1.1s ease-in-out infinite; }
    .eqb{animation-delay:.25s}.eqc{animation-delay:.5s}
    @keyframes eq { 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }
    .avail { animation:av 2.8s ease-in-out infinite; }
    @keyframes av { 0%,100%{opacity:1} 50%{opacity:.35} }
    .hire { animation:hi 3.6s ease-in-out infinite; }
    @keyframes hi { 0%,100%{opacity:.86} 50%{opacity:1} }
  </style>
  <defs><clipPath id="bar"><rect width="1200" height="40" rx="10"/></clipPath></defs>
  <g clip-path="url(#bar)">
    <rect width="1200" height="40" fill="#161C26"/>
    <rect y="39" width="1200" height="1" fill="#2B3648"/>

    <g font-size="14" fill="#E2E8F0">
      <text x="24" y="26" font-weight="800" fill="#4FD1C5" letter-spacing="1">⌘ 1C</text>
      <text x="78" y="26" font-weight="700" fill="#F1F5FB">Finder</text>
      <text x="142" y="26" fill="#7C8798">File</text>
      <text x="184" y="26" fill="#7C8798">Build</text>
      <text x="236" y="26" fill="#7C8798">Ship</text>
      <text x="284" y="26" fill="#7C8798">Automate</text>
    </g>

    <g font-size="13">
      <!-- available for work -->
      <circle class="avail" cx="392" cy="20" r="4" fill="#68D391"/>
      <text x="406" y="25" fill="#68D391">available for new work</text>

      <!-- now playing -->
      <rect class="eq"     x="620" y="14" width="3.5" height="13" rx="1.5" fill="#B794F6"/>
      <rect class="eq eqb" x="626" y="14" width="3.5" height="13" rx="1.5" fill="#4FD1C5"/>
      <rect class="eq eqc" x="632" y="14" width="3.5" height="13" rx="1.5" fill="#F6AD55"/>
      <text x="644" y="25" fill="#7C8798">midnight.fm</text>

      <!-- wifi -->
      <g stroke="#E2E8F0" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".85">
        <path d="M756 24 a10 10 0 0 1 14 0"/><path d="M752 19 a16 16 0 0 1 22 0"/>
        <circle cx="763" cy="28" r="1.6" fill="#E2E8F0" stroke="none"/>
      </g>
      <!-- battery -->
      <rect x="790" y="14" width="26" height="13" rx="3.5" fill="none" stroke="#7C8798" stroke-width="1.4"/>
      <rect x="817" y="18" width="3" height="5" rx="1" fill="#7C8798"/>
      <rect x="792.5" y="16.5" width="21" height="8" rx="2" fill="#68D391"/>

      <text x="836" y="25" fill="#7C8798">PNW</text>
      <text x="880" y="25" fill="#E2E8F0">UTC<tspan class="colon">−</tspan>7</text>

      <!-- hire affordance -->
      <rect class="hire" x="946" y="9" width="232" height="22" rx="11" fill="#4FD1C5" fill-opacity=".14" stroke="#4FD1C5" stroke-opacity=".55"/>
      <text x="1062" y="24" fill="#4FD1C5" font-weight="700" text-anchor="middle">✉ skdev@1commerce.online</text>
    </g>
  </g>
</svg>
