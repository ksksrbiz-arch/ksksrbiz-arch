<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="How a project runs: discovery call, then a fixed quote, then the build with a live preview link, then launch with domain and SSL, then hosted and maintained on an ongoing basis. No surprise invoices, you own everything.">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .fill { animation:fill 15s linear infinite; transform-origin:0 50%; }
    @keyframes fill { 0%{transform:scaleX(0)} 8%{transform:scaleX(.115)} 20%{transform:scaleX(.25)}
                      28%{transform:scaleX(.365)} 40%{transform:scaleX(.5)} 48%{transform:scaleX(.615)}
                      60%{transform:scaleX(.75)} 68%{transform:scaleX(.865)} 80%,92%{transform:scaleX(1)}
                      98%,100%{transform:scaleX(0)} }
    .n1{animation:na 15s steps(1,end) infinite}
    .n2{animation:nb 15s steps(1,end) infinite}
    .n3{animation:nc 15s steps(1,end) infinite}
    .n4{animation:nd 15s steps(1,end) infinite}
    .n5{animation:ne 15s steps(1,end) infinite}
    @keyframes na { 0%,92%{opacity:1} 93%,100%{opacity:0} }
    @keyframes nb { 0%,19%{opacity:0} 20%,92%{opacity:1} 93%,100%{opacity:0} }
    @keyframes nc { 0%,39%{opacity:0} 40%,92%{opacity:1} 93%,100%{opacity:0} }
    @keyframes nd { 0%,59%{opacity:0} 60%,92%{opacity:1} 93%,100%{opacity:0} }
    @keyframes ne { 0%,79%{opacity:0} 80%,92%{opacity:1} 93%,100%{opacity:0} }
    .pulse { transform-box:fill-box; transform-origin:50% 50%; animation:pu 2.5s ease-out infinite; }
    @keyframes pu { 0%{opacity:.6;transform:scale(1)} 70%,100%{opacity:0;transform:scale(1.9)} }
  </style>
  <defs>
    <clipPath id="pr"><rect width="1200" height="260" rx="14"/></clipPath>
    <linearGradient id="prg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD1C5"/><stop offset=".55" stop-color="#68D391"/><stop offset="1" stop-color="#F6AD55"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#pr)">
    <rect width="1200" height="260" fill="#0F131B"/>
    <rect width="1200" height="34" fill="#1B2230"/><rect y="33" width="1200" height="1" fill="#2B3648"/>
    <circle cx="22" cy="17" r="6" fill="#FF5F57"/><circle cx="42" cy="17" r="6" fill="#FEBC2E"/><circle cx="62" cy="17" r="6" fill="#28C840"/>
    <text x="600" y="22" class="mono" font-size="13" fill="#7C8798" text-anchor="middle">how-it-works.app — from first email to live and looked after</text>

    <text x="40" y="70" class="mono" font-size="10.5" fill="#4C5870" letter-spacing="1.8">HOW A PROJECT RUNS</text>

    <!-- rail -->
    <rect x="118" y="126" width="964" height="4" rx="2" fill="#1B2230"/>
    <rect class="fill" x="118" y="126" width="964" height="4" rx="2" fill="url(#prg)"/>

    <!-- stages -->
    <g>
      <circle class="pulse" cx="118" cy="128" r="17" fill="none" stroke="#4FD1C5" stroke-width="2"/>
      <circle cx="118" cy="128" r="17" fill="#161C26" stroke="#2B3648" stroke-width="2"/>
      <circle class="n1" cx="118" cy="128" r="17" fill="#161C26" stroke="#4FD1C5" stroke-width="2.4"/>
      <text x="118" y="133" font-size="14" text-anchor="middle">💬</text>
      <text x="118" y="176" font-size="13.5" font-weight="700" fill="#F1F5FB" text-anchor="middle">Discovery</text>
      <text x="118" y="194" class="mono" font-size="10.5" fill="#7C8798" text-anchor="middle">free call</text>

      <circle cx="359" cy="128" r="17" fill="#161C26" stroke="#2B3648" stroke-width="2"/>
      <circle class="n2" cx="359" cy="128" r="17" fill="#161C26" stroke="#4FD1C5" stroke-width="2.4"/>
      <text x="359" y="133" font-size="14" text-anchor="middle">📋</text>
      <text x="359" y="176" font-size="13.5" font-weight="700" fill="#F1F5FB" text-anchor="middle">Fixed quote</text>
      <text x="359" y="194" class="mono" font-size="10.5" fill="#7C8798" text-anchor="middle">scope + price agreed</text>

      <circle cx="600" cy="128" r="17" fill="#161C26" stroke="#2B3648" stroke-width="2"/>
      <circle class="n3" cx="600" cy="128" r="17" fill="#161C26" stroke="#68D391" stroke-width="2.4"/>
      <text x="600" y="133" font-size="14" text-anchor="middle">🔨</text>
      <text x="600" y="176" font-size="13.5" font-weight="700" fill="#F1F5FB" text-anchor="middle">Build</text>
      <text x="600" y="194" class="mono" font-size="10.5" fill="#7C8798" text-anchor="middle">live preview link throughout</text>

      <circle cx="841" cy="128" r="17" fill="#161C26" stroke="#2B3648" stroke-width="2"/>
      <circle class="n4" cx="841" cy="128" r="17" fill="#161C26" stroke="#68D391" stroke-width="2.4"/>
      <text x="841" y="133" font-size="14" text-anchor="middle">🚀</text>
      <text x="841" y="176" font-size="13.5" font-weight="700" fill="#F1F5FB" text-anchor="middle">Launch</text>
      <text x="841" y="194" class="mono" font-size="10.5" fill="#7C8798" text-anchor="middle">domain, SSL, the lot</text>

      <circle cx="1082" cy="128" r="17" fill="#161C26" stroke="#2B3648" stroke-width="2"/>
      <circle class="n5" cx="1082" cy="128" r="17" fill="#161C26" stroke="#F6AD55" stroke-width="2.4"/>
      <text x="1082" y="133" font-size="14" text-anchor="middle">🛠</text>
      <text x="1082" y="176" font-size="13.5" font-weight="700" fill="#F1F5FB" text-anchor="middle">Hosted &amp; maintained</text>
      <text x="1082" y="194" class="mono" font-size="10.5" fill="#7C8798" text-anchor="middle">updates, backups, a human</text>
    </g>

    <rect y="226" width="1200" height="34" fill="#1B2230"/><rect y="226" width="1200" height="1" fill="#2B3648"/>
    <text x="40" y="248" class="mono" font-size="11.5" fill="#7C8798">no surprise invoices · you own the code, the domain and the accounts</text>
    <text x="1176" y="248" class="mono" font-size="11.5" font-weight="700" fill="#4FD1C5" text-anchor="end">start a project ▸</text>
    <rect x=".75" y=".75" width="1198.5" height="258.5" rx="14" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
