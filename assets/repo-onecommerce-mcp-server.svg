    <text x="190" y="15" font-size="10" fill="#8C8178" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">~/repos/onecommerce-mcp-server</text>
    <circle class="led" cx="24" cy="48" r="4" fill="#28C840"/>
