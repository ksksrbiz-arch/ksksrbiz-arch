    <text x="38" y="97" font-size="11" fill="#8C8178" font-family="'SFMono-Regular',Consolas,monospace">TypeScript</text>
    <text x="356" y="97" font-size="11" font-weight="700" fill="#D97757" text-anchor="end">open ▸</text>
    
