<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" width="380" height="210" role="img" aria-label="Graph — interactive graph visualization">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .n { transform-box: fill-box; transform-origin: 50% 50%; animation: nd 4s ease-in-out infinite; }
    .n.b{animation-delay:.8s} .n.c{animation-delay:1.6s} .n.d{animation-delay:2.4s} .n.e{animation-delay:3.2s}
    @keyframes nd { 0%,100% {transform:scale(1);} 50% {transform:scale(1.35);} }
    .edge { stroke-dasharray: 4 5; animation: ef 1.4s linear infinite; }
    @keyframes ef { to { stroke-dashoffset: -9; } }
    .drift { animation: drift 7s ease-in-out infinite; }
    @keyframes drift { 0%,100% {transform:translate(0,0);} 50% {transform:translate(0,-6px);} }
    .go { animation: go 2.4s ease-in-out infinite; }
    @keyframes go { 0%,100% {opacity:.6;} 50% {opacity:1;} }
  </style>
  <defs><clipPath id="w4"><rect width="380" height="210" rx="12"/></clipPath></defs>
  <g clip-path="url(#w4)">
    <rect width="380" height="210" fill="#1E1814"/>
    <rect width="380" height="30" fill="#2A211A"/>
    <rect y="29" width="380" height="1" fill="#3A2E24"/>
    <circle cx="18" cy="15" r="5" fill="#FF5F57"/><circle cx="35" cy="15" r="5" fill="#FEBC2E"/><circle cx="52" cy="15" r="5" fill="#28C840"/>
    <text x="190" y="20" font-size="12" fill="#8C8178" text-anchor="middle">Graph.app</text>

    <text x="22" y="66" font-size="20" font-weight="800" fill="#F5F0E8">Graph</text>
    <text x="22" y="90" font-size="12.5" fill="#B5AB9F">Interactive graph visualization,</text>
    <text x="22" y="108" font-size="12.5" fill="#B5AB9F">force-directed and hand-rolled in JS.</text>
    <rect x="22" y="128" width="98" height="22" rx="11" fill="#2A211A" stroke="#3A2E24"/>
    <text x="34" y="143" font-size="11" fill="#E8D44D" font-weight="700">JAVASCRIPT</text>
    <text class="go" x="22" y="186" font-size="13" font-weight="700" fill="#E8A33D">Open project ▸</text>

    <!-- motif: floating force graph -->
    <g class="drift">
      <g stroke="#7A5B49" stroke-width="1.5" fill="none">
        <path class="edge" d="M258 82 L308 66"/>
        <path class="edge" d="M258 82 L242 134"/>
        <path class="edge" d="M308 66 L336 118"/>
        <path class="edge" d="M242 134 L296 152"/>
        <path class="edge" d="M296 152 L336 118"/>
        <path class="edge" d="M258 82 L336 118"/>
        <path class="edge" d="M308 66 L296 152"/>
      </g>
      <circle class="n"   cx="258" cy="82"  r="9" fill="#D97757"/>
      <circle class="n b" cx="308" cy="66"  r="7" fill="#E8A33D"/>
      <circle class="n c" cx="336" cy="118" r="8" fill="#C25B3C"/>
      <circle class="n d" cx="296" cy="152" r="7" fill="#E8A33D"/>
      <circle class="n e" cx="242" cy="134" r="6" fill="#F5F0E8"/>
    </g>
    <rect x=".75" y=".75" width="378.5" height="208.5" rx="12" fill="none" stroke="#3A2E24" stroke-width="1.5"/>
  </g>
</svg>
