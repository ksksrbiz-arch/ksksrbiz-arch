<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 288" width="1200" height="288" role="img" aria-label="services — full-stack development for hire: websites and web apps, e-commerce storefronts, managed hosting and deployment, maintenance and support">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    .card { transform-box:fill-box; transform-origin:50% 100%; animation:lift 9s ease-in-out infinite; }
    .c2{animation-delay:2.25s}.c3{animation-delay:4.5s}.c4{animation-delay:6.75s}
    @keyframes lift { 0%,14%,100%{transform:translateY(0)} 5%,9%{transform:translateY(-5px)} }
    .glow { animation:gl 9s ease-in-out infinite; }
    .g2{animation-delay:2.25s}.g3{animation-delay:4.5s}.g4{animation-delay:6.75s}
    @keyframes gl { 0%,14%,100%{stroke-opacity:.35} 5%,9%{stroke-opacity:1} }
    .beat { animation:bt 2.4s ease-in-out infinite; }
    @keyframes bt { 0%,100%{opacity:.5} 50%{opacity:1} }
    .arrow { animation:ar 2.4s ease-in-out infinite; }
    @keyframes ar { 0%,100%{transform:translateX(0);opacity:.65} 50%{transform:translateX(4px);opacity:1} }
  </style>
  <defs><clipPath id="sv"><rect width="1200" height="288" rx="14"/></clipPath></defs>
  <g clip-path="url(#sv)">
    <rect width="1200" height="288" fill="#0F131B"/>
    <rect width="1200" height="34" fill="#1B2230"/><rect y="33" width="1200" height="1" fill="#2B3648"/>
    <circle cx="22" cy="17" r="6" fill="#FF5F57"/><circle cx="42" cy="17" r="6" fill="#FEBC2E"/><circle cx="62" cy="17" r="6" fill="#28C840"/>
    <text x="600" y="22" class="mono" font-size="13" fill="#7C8798" text-anchor="middle">services — full-stack development for hire</text>

    <text x="24" y="60" class="mono" font-size="10.5" fill="#4C5870" letter-spacing="1.8">WHAT I BUILD FOR CLIENTS</text>
    <g class="mono" font-size="11">
      <circle class="beat" cx="1042" cy="56" r="4" fill="#68D391"/>
      <text x="1176" y="60" fill="#68D391" text-anchor="end">available for work</text>
    </g>

    <!-- 1 · websites & web apps -->
    <g class="card">
      <rect x="24" y="76" width="270" height="160" rx="12" fill="#161C26" stroke="#2B3648"/>
      <rect class="glow" x="24" y="76" width="270" height="160" rx="12" fill="none" stroke="#4FD1C5" stroke-opacity=".35"/>
      <rect x="44" y="94" width="30" height="30" rx="8" fill="#4FD1C5" fill-opacity=".16" stroke="#4FD1C5" stroke-opacity=".55"/>
      <path d="M52 106 h14 M52 111 h10" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round"/>
      <circle cx="53" cy="101" r="1.5" fill="#4FD1C5"/><circle cx="58" cy="101" r="1.5" fill="#4FD1C5"/>
      <text x="44" y="148" font-size="15" font-weight="800" fill="#F1F5FB">Websites &amp; web apps</text>
      <g class="mono" font-size="11.5" fill="#9AA6B8">
        <text x="44" y="172">· design + build, mobile first</text>
        <text x="44" y="192">· Next.js · React · Node · TS</text>
        <text x="44" y="212">· fast, accessible, yours</text>
      </g>
    </g>

    <!-- 2 · storefronts -->
    <g class="card c2">
      <rect x="318" y="76" width="270" height="160" rx="12" fill="#161C26" stroke="#2B3648"/>
      <rect class="glow g2" x="318" y="76" width="270" height="160" rx="12" fill="none" stroke="#68D391" stroke-opacity=".35"/>
      <rect x="338" y="94" width="30" height="30" rx="8" fill="#68D391" fill-opacity=".16" stroke="#68D391" stroke-opacity=".55"/>
      <path d="M346 105 h14 l-1.5 11 h-11 z" fill="none" stroke="#68D391" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M349 105 v-2.5 a4 4 0 0 1 8 0 V105" fill="none" stroke="#68D391" stroke-width="1.8"/>
      <text x="338" y="148" font-size="15" font-weight="800" fill="#F1F5FB">E-commerce &amp; storefronts</text>
      <g class="mono" font-size="11.5" fill="#9AA6B8">
        <text x="338" y="172">· Shopify + custom builds</text>
        <text x="338" y="192">· checkout, catalog, payments</text>
        <text x="338" y="212">· migrations &amp; redesigns</text>
      </g>
    </g>

    <!-- 3 · hosting & deployment -->
    <g class="card c3">
      <rect x="612" y="76" width="270" height="160" rx="12" fill="#161C26" stroke="#2B3648"/>
      <rect class="glow g3" x="612" y="76" width="270" height="160" rx="12" fill="none" stroke="#B794F6" stroke-opacity=".35"/>
      <rect x="632" y="94" width="30" height="30" rx="8" fill="#B794F6" fill-opacity=".16" stroke="#B794F6" stroke-opacity=".55"/>
      <rect x="639" y="100" width="16" height="6" rx="1.5" fill="none" stroke="#B794F6" stroke-width="1.6"/>
      <rect x="639" y="109" width="16" height="6" rx="1.5" fill="none" stroke="#B794F6" stroke-width="1.6"/>
      <circle cx="643" cy="103" r="1.2" fill="#B794F6"/><circle cx="643" cy="112" r="1.2" fill="#B794F6"/>
      <text x="632" y="148" font-size="15" font-weight="800" fill="#F1F5FB">Hosting, deploy &amp; uptime</text>
      <g class="mono" font-size="11.5" fill="#9AA6B8">
        <text x="632" y="172">· managed hosting + SSL</text>
        <text x="632" y="192">· deploy on push, rollbacks</text>
        <text x="632" y="212">· monitoring &amp; backups</text>
      </g>
    </g>

    <!-- 4 · maintenance -->
    <g class="card c4">
      <rect x="906" y="76" width="270" height="160" rx="12" fill="#161C26" stroke="#2B3648"/>
      <rect class="glow g4" x="906" y="76" width="270" height="160" rx="12" fill="none" stroke="#F6AD55" stroke-opacity=".35"/>
      <rect x="926" y="94" width="30" height="30" rx="8" fill="#F6AD55" fill-opacity=".16" stroke="#F6AD55" stroke-opacity=".55"/>
      <path d="M934 110 a7 7 0 1 1 5 5" fill="none" stroke="#F6AD55" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M941 100 v6 h5" fill="none" stroke="#F6AD55" stroke-width="1.8" stroke-linecap="round"/>
      <text x="926" y="148" font-size="15" font-weight="800" fill="#F1F5FB">Maintenance &amp; support</text>
      <g class="mono" font-size="11.5" fill="#9AA6B8">
        <text x="926" y="172">· updates, fixes, content</text>
        <text x="926" y="192">· retainers or hourly</text>
        <text x="926" y="212">· a human who answers</text>
      </g>
    </g>

    <rect y="254" width="1200" height="34" fill="#161C26"/><rect y="254" width="1200" height="1" fill="#2B3648"/>
    <g class="mono" font-size="11.5">
      <text x="24" y="275" fill="#7C8798">Pacific Northwest · working with clients anywhere</text>
      <text x="1176" y="275" fill="#4FD1C5" text-anchor="end">1commerce.online <tspan class="arrow">▸</tspan></text>
    </g>
    <rect x=".75" y=".75" width="1198.5" height="286.5" rx="14" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
