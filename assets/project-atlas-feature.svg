5" fill="#FF987A"/><circle class="pulse" cx="935" cy="179" r="17" fill="#FF987A" fill-opacity=".1" stroke="#FF987A" stroke-opacity=".3" style="animation-delay:2.4s"/><circle cx="935" cy="179" r="5" fill="#FF987A"/><text x="649" y="148" font-size="12" fill="#C9D6CC" font-weight="500" class="mono" text-anchor="middle">ALEXANDRIA</text><text x="761" y="265" font-size="12" fill="#C9D6CC" font-weight="500" class="mono" text-anchor="middle">THE KINGDOM</text><text x="859" y="93" font-size="12" fill="#C9D6CC" font-weight="500" class="mono" text-anchor="middle">HILLTOP</text><text x="532" y="381" font-size="13" fill="#AFC0B0" font-weight="400" class="mono" letter-spacing="1">MAP / TIMELINE / CHARACTERS</text><text x="32" y="45" font-size="13" fill="#FF987A" font-weight="700" class="mono" letter-spacing="1">PERSONAL BUILD / FEATURED PROJECT</text><text x="28" y="119" font-size="48" fill="#EDF3EF" font-weight="800" letter-spacing="-1.5">THE WALKING</text><text x="28" y="170" font-size="48" fill="#EDF3EF" font-weight="800" letter-spacing="-1.5">DEAD UNIVERSE</text><text x="28" y="224" font-size="56" fill="#FF987A" font-weight="800" letter-spacing="-1.5">ATLAS</text><text x="32" y="270" font-size="19" fill="#A7B6BA" font-weight="400" >A sprawling universe. One connected view.</text><text x="32" y="301" font-size="18" fill="#A7B6BA" font-weight="400" >Interactive maps, timelines and character data.</text><text x="32" y="344" font-size="13" fill="#6CE5D1" font-weight="700" class="mono" letter-spacing="1">REACT + TYPESCRIPT</text><text x="32" y="384" font-size="18" fill="#EDF3EF" font-weight="700" >Explore the atlas</text><path d="M202 379h28l-7-7 M230 379l-7 7" stroke="#FF987A" fill="none" stroke-width="2"/></g>
<rect x=".75" y=".75" width="998.5" height="418.5" rx="20" fill="none" stroke="#2B3B43" stroke-width="1.5"/>
</svg>
