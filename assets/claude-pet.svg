<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-label="Claude Code terminal">
  <style>
    /* ---- TRICK 1: idle hover/float of the whole window ---- */
    .win    { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    /* ---- TRICK 2: pulsing coral glow on the window border ---- */
    .frame  { animation: glow 3s ease-in-out infinite; }
    /* ---- TRICK 3: traffic-light status dots cycling ---- */
    .dot    { animation: dotpulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .dot.d2 { animation-delay: .4s; }
    .dot.d3 { animation-delay: .8s; }
    /* ---- TRICK 4: blinking block cursor ---- */
    .cursor { animation: blink 1.05s steps(1) infinite; }
    /* ---- TRICK 5: CRT scanline sweeping down the screen ---- */
    .scan   { animation: sweep 4.5s linear infinite; }
    /* slow spin of the brand sunburst mark */
    .burst  { animation: spin 16s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    /* the "typed" command reveals itself (clip-path width grows), then loops */
    .typed  { animation: type 6s steps(28) infinite; }
    /* second line + output fade in on cue */
    .l2 { animation: appear 6s ease infinite; }
    .l3 { animation: appear2 6s ease infinite; }

    @keyframes float    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes glow     { 0%,100% { filter: drop-shadow(0 0 2px rgba(217,119,87,.5)); } 50% { filter: drop-shadow(0 0 9px rgba(217,119,87,.95)); } }
    @keyframes dotpulse { 0%,100% { opacity:.35; transform: scale(.85);} 50% { opacity:1; transform: scale(1.15);} }
    @keyframes blink    { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes sweep    { 0% { transform: translateY(0); opacity:0; } 10% { opacity:.5; } 90% { opacity:.5; } 100% { transform: translateY(150px); opacity:0; } }
    @keyframes spin     { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes type     { 0% { width:0; } 45% { width:188px; } 100% { width:188px; } }
    @keyframes appear   { 0%,52% { opacity:0; } 60%,100% { opacity:1; } }
    @keyframes appear2  { 0%,68% { opacity:0; } 76%,100% { opacity:1; } }
  </style>

  <defs>
    <clipPath id="screenClip"><rect x="16" y="44" width="328" height="160" rx="6"/></clipPath>
    <clipPath id="typeClip"><rect class="typed" x="40" y="78" width="0" height="20"/></clipPath>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332B26"/>
      <stop offset="100%" stop-color="#2A231F"/>
    </linearGradient>
  </defs>

  <g class="win">
    <!-- window frame -->
    <g class="frame">
      <rect x="14" y="14" width="332" height="192" rx="12" fill="#1E1814" stroke="#D97757" stroke-width="2"/>
    </g>

    <!-- title bar -->
    <rect x="16" y="16" width="328" height="28" rx="10" fill="url(#barGrad)"/>
    <rect x="16" y="34" width="328" height="10" fill="#2A231F"/>
    <circle class="dot d1" cx="34" cy="30" r="5" fill="#E5484D"/>
    <circle class="dot d2" cx="52" cy="30" r="5" fill="#E8A33D"/>
    <circle class="dot d3" cx="70" cy="30" r="5" fill="#46A758"/>

    <!-- brand mark + title -->
    <g class="burst" transform="translate(190 30)">
      <g fill="#D97757">
        <rect x="-2" y="-9" width="4" height="18" rx="2"/>
        <rect x="-2" y="-9" width="4" height="18" rx="2" transform="rotate(45)"/>
        <rect x="-2" y="-9" width="4" height="18" rx="2" transform="rotate(90)"/>
        <rect x="-2" y="-9" width="4" height="18" rx="2" transform="rotate(135)"/>
      </g>
    </g>
    <text x="204" y="34" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#B8AEA4">claude-code</text>

    <!-- screen content -->
    <g clip-path="url(#screenClip)" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13">
      <!-- prompt line: typed command -->
      <text x="24" y="73" fill="#D97757">❯</text>
      <text x="40" y="73" fill="#7FB069">claude</text>
      <text x="92" y="73" fill="#E7DFD6">build --profile</text>

      <!-- second prompt: typing reveal + cursor -->
      <text x="24" y="93" fill="#D97757">❯</text>
      <g clip-path="url(#typeClip)">
        <text x="40" y="93" fill="#E7DFD6">ship something great_</text>
      </g>
      <rect class="cursor" x="232" y="82" width="8" height="13" fill="#D97757"/>

      <!-- output lines -->
      <text class="l2" x="24" y="118" fill="#8C8178">✓ compiling ideas...</text>
      <text class="l3" x="24" y="138" fill="#8C8178">✓ <tspan fill="#7FB069">done</tspan> — deployed with style</text>

      <!-- CRT scanline -->
      <rect class="scan" x="16" y="48" width="328" height="14" fill="#D97757" opacity="0.08"/>
    </g>
  </g>
</svg>
