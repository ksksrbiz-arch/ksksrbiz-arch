<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="Claude Code terminal cycling through scenes">
  <style>
    /* ---- TRICK 1: idle hover/float of the whole window ---- */
    .win    { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    /* ---- TRICK 2: pulsing coral glow on the window border ---- */
    .frame  { animation: glow 3s ease-in-out infinite; }
    /* ---- TRICK 3: traffic-light status dots cycling ---- */
    .dot    { animation: dotpulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .dot.d2 { animation-delay: .4s; }
    .dot.d3 { animation-delay: .8s; }
    /* ---- TRICK 4: blinking block cursor ---- */
    .cursor { animation: blink 1.05s steps(1) infinite; }
    /* ---- TRICK 5: CRT scanline sweeping down the screen ---- */
    .scan   { animation: sweep 4.5s linear infinite; }
    /* slow spin of the brand sunburst mark */
    .burst  { animation: spin 16s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }

    /* ---- multi-scene cycle: 4 scenes over 18s ---- */
    .scene  { opacity: 0; animation: show 18s ease infinite; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 4.5s; }
    .s3 { animation-delay: 9s; }
    .s4 { animation-delay: 13.5s; }

    @keyframes float    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes glow     { 0%,100% { filter: drop-shadow(0 0 2px rgba(217,119,87,.5)); } 50% { filter: drop-shadow(0 0 10px rgba(217,119,87,.95)); } }
    @keyframes dotpulse { 0%,100% { opacity:.35; transform: scale(.85);} 50% { opacity:1; transform: scale(1.15);} }
    @keyframes blink    { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes sweep    { 0% { transform: translateY(0); opacity:0; } 10% { opacity:.5; } 90% { opacity:.5; } 100% { transform: translateY(190px); opacity:0; } }
    @keyframes spin     { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    /* visible for ~22% of the 18s loop, with quick cross-fades */
    @keyframes show     { 0% { opacity:0; } 2% { opacity:1; } 22% { opacity:1; } 25% { opacity:0; } 100% { opacity:0; } }
  </style>

  <defs>
    <clipPath id="screenClip"><rect x="12" y="42" width="456" height="206" rx="8"/></clipPath>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332B26"/>
      <stop offset="100%" stop-color="#2A231F"/>
    </linearGradient>
  </defs>

  <g class="win">
    <!-- window frame -->
    <g class="frame">
      <rect x="10" y="10" width="460" height="240" rx="14" fill="#1E1814" stroke="#D97757" stroke-width="2"/>
    </g>

    <!-- title bar -->
    <rect x="12" y="12" width="456" height="30" rx="12" fill="url(#barGrad)"/>
    <rect x="12" y="32" width="456" height="10" fill="#2A231F"/>
    <circle class="dot d1" cx="32" cy="27" r="5.5" fill="#E5484D"/>
    <circle class="dot d2" cx="52" cy="27" r="5.5" fill="#E8A33D"/>
    <circle class="dot d3" cx="72" cy="27" r="5.5" fill="#46A758"/>

    <!-- brand mark + title -->
    <g class="burst" transform="translate(244 27)">
      <g fill="#D97757">
        <rect x="-2" y="-9" width="4" height="18" rx="2"/>
        <rect x="-2" y="-9" width="4" height="18" rx="2" transform="rotate(45)"/>
        <rect x="-2" y="-9" width="4" height="18" rx="2" transform="rotate(90)"/>
        <rect x="-2" y="-9" width="4" height="18" rx="2" transform="rotate(135)"/>
      </g>
    </g>
    <text x="258" y="31" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#B8AEA4">claude-code</text>

    <!-- screen content -->
    <g clip-path="url(#screenClip)" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15">

      <!-- SCENE 1: build -->
      <g class="scene s1">
        <text x="24" y="80" fill="#D97757">❯</text>
        <text x="40" y="80" fill="#7FB069">claude</text>
        <text x="100" y="80" fill="#E7DFD6">build --profile</text>
        <rect class="cursor" x="240" y="69" width="9" height="14" fill="#D97757"/>
        <text x="24" y="112" fill="#8C8178">↻ compiling components...</text>
        <text x="24" y="140" fill="#8C8178">✓ <tspan fill="#7FB069">done</tspan> — exit code 0</text>
      </g>

      <!-- SCENE 2: commit -->
      <g class="scene s2">
        <text x="24" y="80" fill="#D97757">❯</text>
        <text x="40" y="80" fill="#7FB069">git</text>
        <text x="72" y="80" fill="#E7DFD6">commit -m "ship it"</text>
        <rect class="cursor" x="268" y="69" width="9" height="14" fill="#D97757"/>
        <text x="24" y="112" fill="#8C8178">[main 1a2b3c] ship it</text>
        <text x="24" y="140" fill="#8C8178">✓ <tspan fill="#7FB069">5 files changed</tspan>, 0 conflicts</text>
      </g>

      <!-- SCENE 3: test -->
      <g class="scene s3">
        <text x="24" y="80" fill="#D97757">❯</text>
        <text x="40" y="80" fill="#7FB069">npm</text>
        <text x="72" y="80" fill="#E7DFD6">test</text>
        <rect class="cursor" x="112" y="69" width="9" height="14" fill="#D97757"/>
        <text x="24" y="112" fill="#8C8178"><tspan fill="#46A758">PASS</tspan> profile.test.ts</text>
        <text x="24" y="140" fill="#8C8178">✓ <tspan fill="#7FB069">42 passing</tspan> (1.2s)</text>
      </g>

      <!-- SCENE 4: deploy -->
      <g class="scene s4">
        <text x="24" y="80" fill="#D97757">❯</text>
        <text x="40" y="80" fill="#7FB069">claude</text>
        <text x="100" y="80" fill="#E7DFD6">deploy --prod</text>
        <rect class="cursor" x="228" y="69" width="9" height="14" fill="#D97757"/>
        <text x="24" y="112" fill="#8C8178">↑ uploading to vercel...</text>
        <text x="24" y="140" fill="#8C8178">🚀 <tspan fill="#D97757">live</tspan> at 1commerce.online</text>
      </g>

      <!-- CRT scanline (over all scenes) -->
      <rect class="scan" x="12" y="46" width="456" height="16" fill="#D97757" opacity="0.08"/>
    </g>
  </g>
</svg>
