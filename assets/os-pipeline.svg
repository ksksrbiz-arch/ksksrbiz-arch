<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Deploy pipeline: a git push triggers a build, which ships to CDN edge nodes and goes live with SSL. Push to live in about ninety seconds, with instant rollback if anything breaks.">
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,Menlo,monospace; }
    /* 10s master: push -> wire -> build -> wire -> edge -> wire -> live */
    .pkt { animation:pkt 10s ease-in-out infinite; }
    @keyframes pkt {
      0%,6%{transform:translateX(0);opacity:0} 10%{opacity:1}
      25%{transform:translateX(108px)} 45%{transform:translateX(108px)}
      55%{transform:translateX(432px)} 70%{transform:translateX(432px)}
      75%{transform:translateX(756px);opacity:1} 93%{opacity:1}
      96%,100%{transform:translateX(756px);opacity:0}
    }
    .flow { stroke-dasharray:5 7; animation:fl 1.1s linear infinite; }
    @keyframes fl { to{stroke-dashoffset:-12} }
    .a1{animation:a1 10s steps(1,end) infinite}
    .a2{animation:a2 10s steps(1,end) infinite}
    .a3{animation:a3 10s steps(1,end) infinite}
    .a4{animation:a4 10s steps(1,end) infinite}
    @keyframes a1 { 0%,17%{stroke:#4FD1C5;stroke-opacity:1} 18%,100%{stroke:#2B3648;stroke-opacity:1} }
    @keyframes a2 { 0%,24%{stroke:#2B3648} 25%,47%{stroke:#F6AD55} 48%,100%{stroke:#2B3648} }
    @keyframes a3 { 0%,54%{stroke:#2B3648} 55%,72%{stroke:#B794F6} 73%,100%{stroke:#2B3648} }
    @keyframes a4 { 0%,74%{stroke:#2B3648} 75%,95%{stroke:#68D391} 96%,100%{stroke:#2B3648} }
    .log1{animation:lg 10s steps(1,end) infinite}
    .log2{animation:lg 10s steps(1,end) infinite;animation-delay:.5s}
    .log3{animation:lg 10s steps(1,end) infinite;animation-delay:1s}
    @keyframes lg { 0%,27%{opacity:0} 28%,47%{opacity:1} 48%,94%{opacity:.4} 96%,100%{opacity:0} }
    .bar { transform-origin:0 50%; animation:bar 10s linear infinite; }
    @keyframes bar { 0%,26%{transform:scaleX(0)} 46%,95%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
    .node { transform-box:fill-box; transform-origin:50% 50%; animation:nd 10s ease-out infinite; }
    .e2{animation-delay:.16s}.e3{animation-delay:.32s}.e4{animation-delay:.48s}.e5{animation-delay:.64s}
    @keyframes nd { 0%,56%{fill:#2B3648;transform:scale(1)} 60%{fill:#B794F6;transform:scale(1.5)}
                    72%{fill:#B794F6;transform:scale(1)} 74%,100%{fill:#2B3648;transform:scale(1)} }
    .live { animation:lv 10s steps(1,end) infinite; }
    @keyframes lv { 0%,75%{opacity:0} 76%,95%{opacity:1} 96%,100%{opacity:0} }
    .lock { transform-box:fill-box; transform-origin:50% 50%; animation:lk 10s ease-out infinite; }
    @keyframes lk { 0%,76%{opacity:0;transform:scale(.6)} 80%,95%{opacity:1;transform:scale(1)} 96%,100%{opacity:0} }
    .caret { animation:bl 1.05s steps(1,end) infinite; }
    @keyframes bl { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .spin { transform-box:fill-box; transform-origin:50% 50%; animation:sp 1.4s linear infinite; }
    @keyframes sp { to{transform:rotate(360deg)} }
  </style>
  <defs>
    <clipPath id="pl"><rect width="1200" height="300" rx="14"/></clipPath>
    <linearGradient id="plive" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68D391"/><stop offset="1" stop-color="#4FD1C5"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#pl)">
    <rect width="1200" height="300" fill="#0F131B"/>
    <rect width="1200" height="34" fill="#1B2230"/><rect y="33" width="1200" height="1" fill="#2B3648"/>
    <circle cx="22" cy="17" r="6" fill="#FF5F57"/><circle cx="42" cy="17" r="6" fill="#FEBC2E"/><circle cx="62" cy="17" r="6" fill="#28C840"/>
    <text x="600" y="22" class="mono" font-size="13" fill="#7C8798" text-anchor="middle">deploy.pipeline — push to live, automatically</text>

    <text x="32" y="60" class="mono" font-size="10.5" fill="#4C5870" letter-spacing="1.8">EVERY CHANGE SHIPS THE SAME WAY</text>

    <!-- wires -->
    <g fill="none" stroke-width="2">
      <path class="flow" d="M248 150 H356" stroke="#46536B"/>
      <path class="flow" d="M572 150 H680" stroke="#46536B"/>
      <path class="flow" d="M896 150 H1004" stroke="#46536B"/>
    </g>

    <!-- 1 push -->
    <rect class="a1" x="32" y="70" width="216" height="160" rx="12" fill="#161C26" stroke="#2B3648" stroke-width="2"/>
    <text x="48" y="94" class="mono" font-size="10.5" fill="#4C5870" letter-spacing="1.4">1 · COMMIT</text>
    <text x="48" y="126" class="mono" font-size="12.5" fill="#4FD1C5">$ <tspan fill="#F1F5FB">git push</tspan></text>
    <text x="48" y="146" class="mono" font-size="12.5" fill="#7C8798">  origin main<tspan class="caret" fill="#4FD1C5">▌</tspan></text>
    <rect x="48" y="164" width="184" height="1" fill="#2B3648"/>
    <text x="48" y="186" class="mono" font-size="11" fill="#68D391">+ 12 −3  hero copy</text>
    <text x="48" y="206" class="mono" font-size="11" fill="#4C5870">⎇ main · a4f9c2e</text>

    <!-- 2 build -->
    <rect class="a2" x="356" y="70" width="216" height="160" rx="12" fill="#161C26" stroke="#2B3648" stroke-width="2"/>
    <text x="372" y="94" class="mono" font-size="10.5" fill="#4C5870" letter-spacing="1.4">2 · BUILD</text>
    <g class="spin" opacity=".9"><path d="M540 86 a7 7 0 1 1 -4 12" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/></g>
    <text class="log1 mono" x="372" y="122" font-size="11" fill="#9AA6B8">▸ install deps</text>
    <text class="log2 mono" x="372" y="144" font-size="11" fill="#9AA6B8">▸ compile + bundle</text>
    <text class="log3 mono" x="372" y="166" font-size="11" fill="#68D391">✓ 0 errors</text>
    <rect x="372" y="188" width="184" height="6" rx="3" fill="#0F131B" stroke="#2B3648"/>
    <rect class="bar" x="373" y="189" width="182" height="4" rx="2" fill="#F6AD55"/>
    <text x="372" y="214" class="mono" font-size="10.5" fill="#4C5870">immutable build · cached</text>

    <!-- 3 edge -->
    <rect class="a3" x="680" y="70" width="216" height="160" rx="12" fill="#161C26" stroke="#2B3648" stroke-width="2"/>
    <text x="696" y="94" class="mono" font-size="10.5" fill="#4C5870" letter-spacing="1.4">3 · EDGE</text>
    <g stroke="#2B3648" stroke-width="1" fill="none" opacity=".8">
      <ellipse cx="788" cy="152" rx="72" ry="30"/><ellipse cx="788" cy="152" rx="44" ry="30"/>
      <ellipse cx="788" cy="152" rx="16" ry="30"/><path d="M716 152 H860"/><path d="M730 134 H846 M730 170 H846"/>
    </g>
    <circle class="node"    cx="740" cy="140" r="4.5" fill="#2B3648"/>
    <circle class="node e2" cx="800" cy="132" r="4.5" fill="#2B3648"/>
    <circle class="node e3" cx="836" cy="156" r="4.5" fill="#2B3648"/>
    <circle class="node e4" cx="762" cy="172" r="4.5" fill="#2B3648"/>
    <circle class="node e5" cx="812" cy="176" r="4.5" fill="#2B3648"/>
    <text x="788" y="214" class="mono" font-size="10.5" fill="#4C5870" text-anchor="middle">cached at the edge</text>

    <!-- 4 live -->
    <rect class="a4" x="1004" y="70" width="164" height="160" rx="12" fill="#161C26" stroke="#2B3648" stroke-width="2"/>
    <text x="1020" y="94" class="mono" font-size="10.5" fill="#4C5870" letter-spacing="1.4">4 · LIVE</text>
    <g class="live">
      <circle cx="1086" cy="146" r="27" fill="#68D391" fill-opacity=".16" stroke="#68D391" stroke-width="2"/>
      <path d="M1074 146 l8 8 15 -17" fill="none" stroke="#68D391" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1086" y="196" class="mono" font-size="12" font-weight="800" fill="#68D391" text-anchor="middle">DEPLOYED</text>
    </g>
    <g class="lock">
      <rect x="1074" y="206" width="24" height="16" rx="3" fill="none" stroke="#4FD1C5" stroke-width="1.8"/>
      <path d="M1080 206 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#4FD1C5" stroke-width="1.8"/>
    </g>

    <!-- travelling commit packet -->
    <g class="pkt">
      <g transform="translate(248,150)">
        <rect x="-9" y="-9" width="18" height="18" rx="5" fill="#4FD1C5"/>
        <path d="M-4 0 l3 3 5 -6" fill="none" stroke="#0F131B" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <rect y="266" width="1200" height="34" fill="#1B2230"/><rect y="266" width="1200" height="1" fill="#2B3648"/>
    <circle cx="32" cy="283" r="4.5" fill="#68D391"/>
    <text x="48" y="288" class="mono" font-size="11.5" fill="#7C8798">push to live in about 90 seconds · broken build never reaches the site · one-click rollback</text>
    <text x="1176" y="288" class="mono" font-size="11.5" font-weight="700" fill="#4FD1C5" text-anchor="end">this runs on every client site ▸</text>
    <rect x=".75" y=".75" width="1198.5" height="298.5" rx="14" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
