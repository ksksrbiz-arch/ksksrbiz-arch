<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-label="Terminal: whoami and neofetch for 1COMMERCE OS — commerce, simplified, Pacific Northwest">
  <!--
    about.sh — 22s loop: whoami, then a neofetch flex.
    Typing = bg-colored rect sliding right with steps().
  -->
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sess { animation: sess 22s linear infinite; }
    @keyframes sess { 0% {opacity:1;} 93% {opacity:1;} 96% {opacity:0;} 99% {opacity:0;} 100% {opacity:1;} }

    .t1 { animation: t1 22s linear infinite; }
    @keyframes t1 { 0%,2% {transform:translateX(0); animation-timing-function:steps(6,end);} 7% {transform:translateX(64px);} 100% {transform:translateX(64px);} }
    .t2 { animation: t2 22s linear infinite; }
    @keyframes t2 { 0%,12% {transform:translateX(0); animation-timing-function:steps(8,end);} 17% {transform:translateX(84px);} 100% {transform:translateX(84px);} }

    .o1 { animation: o1 22s steps(1,end) infinite; }
    @keyframes o1 { 0%,8.5% {opacity:0;} 9%,100% {opacity:1;} }
    .o2 { animation: o2 22s steps(1,end) infinite; }
    @keyframes o2 { 0%,10.5% {opacity:0;} 11%,100% {opacity:1;} }
    .nf { animation: nf 22s ease-out infinite; transform-box: fill-box; transform-origin: 20% 30%; }
    @keyframes nf { 0%,18.5% {opacity:0; transform:scale(.96);} 20.5%,100% {opacity:1; transform:scale(1);} }
    .pal { animation: pal 22s steps(1,end) infinite; }
    @keyframes pal { 0%,23% {opacity:0;} 23.5%,100% {opacity:1;} }
    .o5 { animation: o5 22s steps(1,end) infinite; }
    @keyframes o5 { 0%,26% {opacity:0;} 26.5%,100% {opacity:1;} }

    .caret { animation: blink 1s steps(1,end) infinite; }
    @keyframes blink { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
    .logo1c { animation: glow 3.4s ease-in-out infinite; }
    @keyframes glow { 0%,100% {opacity:.85;} 50% {opacity:1;} }
  </style>
  <defs>
    <clipPath id="win"><rect width="700" height="380" rx="12"/></clipPath>
    <linearGradient id="lg1c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD1C5"/><stop offset="1" stop-color="#B794F6"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#win)">
    <rect width="700" height="380" fill="#0F131B"/>
    <rect width="700" height="36" fill="#161C26"/>
    <rect y="35" width="700" height="1" fill="#2B3648"/>
    <circle cx="22" cy="18" r="6" fill="#FF5F57"/>
    <circle cx="42" cy="18" r="6" fill="#FEBC2E"/>
    <circle cx="62" cy="18" r="6" fill="#28C840"/>
    <text x="350" y="23" font-size="13" fill="#7C8798" text-anchor="middle">about.sh — zsh — 1commerce</text>

    <g class="sess" font-size="14.5">
      <!-- $ whoami -->
      <text x="24" y="66" fill="#4FD1C5" font-weight="700">$ <tspan fill="#F1F5FB" font-weight="400">whoami</tspan></text>
      <rect class="t1" x="42" y="52" width="70" height="20" fill="#0F131B"/>
      <g class="o1">
        <text x="24" y="92" fill="#F6AD55" font-weight="700">1COMMERCE <tspan fill="#7C8798" font-weight="400">— full-stack development for hire · sites, storefronts, hosting</tspan></text>
      </g>

      <!-- $ neofetch -->
      <g class="o2">
        <text x="24" y="124" fill="#4FD1C5" font-weight="700">$ <tspan fill="#F1F5FB" font-weight="400">neofetch</tspan></text>
      </g>
      <rect class="t2" x="42" y="110" width="94" height="20" fill="#0F131B"/>

      <!-- neofetch output -->
      <g class="nf">
        <!-- logo panel -->
        <rect x="24" y="142" width="150" height="150" rx="14" fill="#121826" stroke="url(#lg1c)" stroke-width="2"/>
        <g class="logo1c">
          <text x="99" y="216" font-size="52" font-weight="800" fill="url(#lg1c)" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif">1C</text>
          <text x="99" y="248" font-size="11" fill="#7C8798" text-anchor="middle" letter-spacing="3">OS v7.2</text>
        </g>
        <g stroke="#2B3648" stroke-width="1">
          <path d="M40 260 h118"/>
        </g>
        <text x="99" y="278" font-size="10" fill="#4C5870" text-anchor="middle">est. PNW</text>

        <!-- info block -->
        <g font-size="13.5">
          <text x="200" y="160" fill="#4FD1C5" font-weight="700">keith<tspan fill="#7C8798">@</tspan><tspan fill="#B794F6" font-weight="700">1commerce</tspan></text>
          <text x="200" y="178" fill="#2B3648">─────────────────────────────</text>
          <text x="200" y="200" fill="#F6AD55" font-weight="700">OS<tspan x="288" fill="#F1F5FB" font-weight="400">1COMMERCE OS v7.2 (midnight)</tspan></text>
          <text x="200" y="222" fill="#F6AD55" font-weight="700">Host<tspan x="288" fill="#F1F5FB" font-weight="400">Pacific Northwest · UTC−7</tspan></text>
          <text x="200" y="244" fill="#F6AD55" font-weight="700">Kernel<tspan x="288" fill="#F1F5FB" font-weight="400">cathedral.framework</tspan></text>
          <text x="200" y="266" fill="#F6AD55" font-weight="700">Shell<tspan x="288" fill="#F1F5FB" font-weight="400">claude-code (daily driver)</tspan></text>
          <text x="200" y="288" fill="#F6AD55" font-weight="700">Stack<tspan x="288" fill="#F1F5FB" font-weight="400">TS · Next.js · Node · Supabase · Py</tspan></text>
          <text x="200" y="310" fill="#F6AD55" font-weight="700">Serving<tspan x="288" fill="#F1F5FB" font-weight="400">client sites · SSL, deploys, backups</tspan></text>
        </g>

        <!-- palette swatches -->
        <g class="pal">
          <rect x="200" y="326" width="20" height="14" rx="3" fill="#0F131B" stroke="#2B3648"/>
          <rect x="224" y="326" width="20" height="14" rx="3" fill="#4FD1C5"/>
          <rect x="248" y="326" width="20" height="14" rx="3" fill="#B794F6"/>
          <rect x="272" y="326" width="20" height="14" rx="3" fill="#F6AD55"/>
          <rect x="296" y="326" width="20" height="14" rx="3" fill="#68D391"/>
          <rect x="320" y="326" width="20" height="14" rx="3" fill="#FF8B6A"/>
          <rect x="344" y="326" width="20" height="14" rx="3" fill="#7C8798"/>
          <rect x="368" y="326" width="20" height="14" rx="3" fill="#F1F5FB"/>
        </g>
      </g>

      <!-- fresh prompt -->
      <g class="o5">
        <text x="24" y="366" fill="#4FD1C5" font-weight="700">$</text>
        <rect class="caret" x="42" y="353" width="9" height="16" fill="#F1F5FB"/>
      </g>
    </g>

    <rect x=".75" y=".75" width="698.5" height="378.5" rx="12" fill="none" stroke="#2B3648" stroke-width="1.5"/>
  </g>
</svg>
