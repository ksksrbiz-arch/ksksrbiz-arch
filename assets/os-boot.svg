<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="1COMMERCE OS boot sequence">
  <!--
    1COMMERCE OS — boot hero, v5.2 cinematic pass.
    22s master loop: BIOS log (0–5.5s) → desktop: rising sun behind ridgelines,
    perspective grid, light-sweep wordmark, shooting stars, embers, patrol ship
    (5.5–20.5s) → fade to black → loop. Self-contained CSS + SMIL.
  -->
  <style>
    .bios      { animation: biosPhase 22s linear infinite; }
    .desktop   { animation: deskPhase 22s linear infinite; }
    .blackout  { animation: blackPhase 22s linear infinite; }
    @keyframes biosPhase  { 0% {opacity:1;} 23% {opacity:1;} 26% {opacity:0;} 100% {opacity:0;} }
    @keyframes deskPhase  { 0% {opacity:0;} 24% {opacity:0;} 28% {opacity:1;} 100% {opacity:1;} }
    @keyframes blackPhase { 0% {opacity:1;} 2% {opacity:0;} 92% {opacity:0;} 97% {opacity:1;} 100% {opacity:1;} }

    .l1 { animation: pop 22s steps(1,end) infinite; }
    .l2 { animation: pop 22s steps(1,end) infinite; animation-delay: .8s; }
    .l3 { animation: pop 22s steps(1,end) infinite; animation-delay: 1.6s; }
    .l4 { animation: pop 22s steps(1,end) infinite; animation-delay: 2.4s; }
    .l5 { animation: pop 22s steps(1,end) infinite; animation-delay: 3.2s; }
    .l6 { animation: pop 22s steps(1,end) infinite; animation-delay: 4.1s; }
    @keyframes pop { 0% {opacity:0;} 1% {opacity:1;} 100% {opacity:1;} }
    .ok { animation: pop 22s steps(1,end) infinite; }
    .ok2 { animation-delay: 1.1s; } .ok3 { animation-delay: 1.9s; }
    .ok4 { animation-delay: 2.7s; } .ok5 { animation-delay: 3.5s; }
    .caret { animation: blink 1s steps(1,end) infinite; }
    @keyframes blink { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
    .boot-bar { animation: bootbar 22s linear infinite; transform-origin: 0 50%; }
    @keyframes bootbar { 0% {transform:scaleX(0);} 22% {transform:scaleX(1);} 100% {transform:scaleX(1);} }

    .sunrise { animation: sunrise 22s ease-out infinite; }
    @keyframes sunrise { 0%,24% {transform:translateY(175px);} 42% {transform:translateY(0);} 100% {transform:translateY(0);} }
    .corona { animation: corona 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    @keyframes corona { 0%,100% {opacity:.5; transform:scale(1);} 50% {opacity:.95; transform:scale(1.06);} }

    .word { animation: wordin 22s ease-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    @keyframes wordin { 0%,26% {opacity:0; transform:scale(.92);} 35% {opacity:1; transform:scale(1);} 100% {opacity:1; transform:scale(1);} }
    .tag  { animation: tagin 22s ease-out infinite; }
    @keyframes tagin { 0%,32% {opacity:0;} 41% {opacity:1;} 100% {opacity:1;} }

    .gridmove { animation: gm 1.1s linear infinite; }
    @keyframes gm { from {transform:translateY(0);} to {transform:translateY(26px);} }
    .glowpulse { animation: gp 4s ease-in-out infinite; }
    @keyframes gp { 0%,100% {opacity:.5;} 50% {opacity:1;} }

    .star  { animation: twk 3.2s ease-in-out infinite; }
    .star.b { animation-delay: 1.1s; } .star.c { animation-delay: 2.2s; }
    @keyframes twk { 0%,100% {opacity:.15;} 50% {opacity:.9;} }

    .shoot { animation: shoot 9s linear infinite; }
    @keyframes shoot { 0%,74% {opacity:0; transform:translate(0,0);} 76% {opacity:1;}
                       82% {opacity:0; transform:translate(-260px,90px);} 100% {opacity:0; transform:translate(-260px,90px);} }
    .shoot2 { animation: shoot2 13s linear infinite; }
    @keyframes shoot2 { 0%,38% {opacity:0; transform:translate(0,0);} 40% {opacity:.9;}
                        46% {opacity:0; transform:translate(220px,70px);} 100% {opacity:0; transform:translate(220px,70px);} }

    .ember { animation: ember 6s ease-out infinite; }
    .ember.b { animation-delay: 2s; } .ember.c { animation-delay: 4s; }
    .ember.d { animation-delay: 1s; } .ember.e { animation-delay: 3.4s; }
    @keyframes ember { 0% {transform:translateY(0); opacity:0;} 12% {opacity:.9;} 100% {transform:translateY(-130px); opacity:0;} }

    .ship { animation: ship 14s linear infinite; }
    @keyframes ship { 0% {transform:translateX(-80px);} 100% {transform:translateX(1330px);} }
    .shipbob { animation: shipbob 2.2s ease-in-out infinite; }
    @keyframes shipbob { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-5px);} }

    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { from {transform:translateY(-40px);} to {transform:translateY(440px);} }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#0B0805"/>
      <stop offset=".5" stop-color="#1E1510"/>
      <stop offset=".82" stop-color="#4A2415"/>
      <stop offset="1"  stop-color="#6E3018"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#F5C64F"/>
      <stop offset=".45" stop-color="#E8894F"/>
      <stop offset="1"   stop-color="#8A3520"/>
    </linearGradient>
    <linearGradient id="wordgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset=".55" stop-color="#F3CCA4"/>
      <stop offset="1" stop-color="#DD7E58"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".46" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset=".54" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="sunglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E8894F" stop-opacity=".6"/>
      <stop offset="1" stop-color="#E8894F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D97757" stop-opacity="0"/>
      <stop offset="1" stop-color="#D97757" stop-opacity=".9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="430" rx="14"/></clipPath>
    <clipPath id="ground"><rect x="0" y="268" width="1200" height="162"/></clipPath>
    <clipPath id="sunclip"><circle cx="600" cy="252" r="104"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <g clip-path="url(#frame)">
    <!-- =============== DESKTOP SCENE =============== -->
    <g class="desktop">
      <rect width="1200" height="430" fill="url(#sky)"/>

      <!-- stars -->
      <g fill="#F5F0E8">
        <circle class="star"   cx="120" cy="60"  r="1.6"/><circle class="star b" cx="300" cy="110" r="1.2"/>
        <circle class="star c" cx="450" cy="45"  r="1.8"/><circle class="star"   cx="760" cy="70"  r="1.3"/>
        <circle class="star b" cx="920" cy="40"  r="1.7"/><circle class="star c" cx="1080" cy="95" r="1.4"/>
        <circle class="star"   cx="1020" cy="150" r="1.1"/><circle class="star b" cx="200"  cy="160" r="1.2"/>
        <circle class="star c" cx="560" cy="35" r="1.2"/><circle class="star" cx="680" cy="120" r="1"/>
        <circle class="star b" cx="60" cy="120" r="1.4"/><circle class="star c" cx="1150" cy="55" r="1.3"/>
      </g>

      <!-- shooting stars -->
      <g class="shoot"><line x1="1010" y1="52" x2="1075" y2="30" stroke="#F5F0E8" stroke-width="2" stroke-linecap="round" opacity=".9"/></g>
      <g class="shoot2"><line x1="150" y1="40" x2="95" y2="22" stroke="#E8A33D" stroke-width="1.6" stroke-linecap="round" opacity=".8"/></g>

      <!-- rising sun -->
      <g class="sunrise">
        <circle class="corona" cx="600" cy="252" r="200" fill="url(#sunglow)"/>
        <g clip-path="url(#sunclip)">
          <circle cx="600" cy="252" r="104" fill="url(#sunset)"/>
          <g fill="#1E1510">
            <rect x="480" y="222" width="240" height="5"/>
            <rect x="480" y="238" width="240" height="7"/>
            <rect x="480" y="256" width="240" height="10"/>
            <rect x="480" y="278" width="240" height="13"/>
          </g>
        </g>
      </g>

      <!-- mountain ridgelines (echo of terrain.app) -->
      <path d="M0 258 L60 240 L130 252 L200 232 L266 248 L330 226 L400 246 L470 234 L540 250 L610 238 L690 252 L760 230 L830 248 L900 236 L980 252 L1050 234 L1120 248 L1200 238 L1200 268 L0 268 Z"
            fill="#221610" stroke="#B85F3F" stroke-width="1" stroke-opacity=".5"/>
      <path d="M0 268 L80 252 L150 262 L230 246 L300 260 L380 244 L450 262 L530 250 L600 264 L680 248 L750 262 L830 250 L910 264 L980 250 L1060 262 L1130 252 L1200 262 L1200 268 L0 268 Z"
            fill="#160F0A" stroke="#D97757" stroke-width="1.2" stroke-opacity=".8"/>

      <!-- patrol ship -->
      <g class="ship" opacity=".9">
        <g class="shipbob">
          <path d="M0 96 l26 7 -26 7 6 -7 z" fill="#F5F0E8"/>
          <line x1="-34" y1="103" x2="-4" y2="103" stroke="#E8A33D" stroke-width="1.6" stroke-dasharray="5 6" opacity=".7"/>
        </g>
      </g>

      <!-- horizon glow -->
      <rect x="0" y="263" width="1200" height="9" fill="#E8894F" opacity=".65" filter="url(#soft)" class="glowpulse"/>

      <!-- perspective grid -->
      <g clip-path="url(#ground)">
        <rect x="0" y="268" width="1200" height="162" fill="#120C08"/>
        <g stroke="#D97757" stroke-opacity=".5" stroke-width="1.4">
          <path d="M600 268 L600 430"/>
          <path d="M600 268 L440 430"/><path d="M600 268 L760 430"/>
          <path d="M600 268 L240 430"/><path d="M600 268 L960 430"/>
          <path d="M600 268 L-60 430"/><path d="M600 268 L1260 430"/>
          <path d="M600 268 L-480 430"/><path d="M600 268 L1680 430"/>
        </g>
        <g class="gridmove" stroke="#D97757" stroke-opacity=".55" stroke-width="1.8">
          <path d="M0 272 H1200"/><path d="M0 280 H1200"/>
          <path d="M0 292 H1200"/><path d="M0 308 H1200"/>
          <path d="M0 328 H1200"/><path d="M0 352 H1200"/>
          <path d="M0 380 H1200"/><path d="M0 412 H1200"/>
        </g>
        <!-- rising embers -->
        <g fill="#E8A33D">
          <circle class="ember"   cx="240" cy="420" r="2.2"/>
          <circle class="ember b" cx="480" cy="428" r="1.8"/>
          <circle class="ember c" cx="730" cy="424" r="2.4"/>
          <circle class="ember d" cx="950" cy="430" r="1.9"/>
          <circle class="ember e" cx="1120" cy="422" r="1.6"/>
        </g>
      </g>

      <!-- wordmark with light sweep -->
      <g text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
        <g class="word">
          <text x="600" y="192" font-size="88" font-weight="800" letter-spacing="8"
                fill="#E8894F" opacity=".65" filter="url(#soft)">1COMMERCE OS</text>
          <text x="600" y="192" font-size="88" font-weight="800" letter-spacing="8"
                fill="url(#wordgrad)" stroke="#5E2415" stroke-width="1.2" paint-order="stroke">1COMMERCE OS</text>
          <text x="600" y="192" font-size="88" font-weight="800" letter-spacing="8"
                fill="url(#sweep)">1COMMERCE OS</text>
        </g>
        <g class="tag">
          <line x1="290" y1="228" x2="385" y2="228" stroke="#E8A33D" stroke-width="1" opacity=".7"/>
          <line x1="815" y1="228" x2="910" y2="228" stroke="#E8A33D" stroke-width="1" opacity=".7"/>
          <text x="600" y="235" font-size="20" font-weight="700" letter-spacing="7" fill="#FFF3E0"
                filter="url(#soft2)" opacity=".55">COMMERCE · SIMPLIFIED</text>
          <text x="600" y="235" font-size="20" font-weight="700" letter-spacing="7" fill="#FFF3E0">COMMERCE · SIMPLIFIED</text>
        </g>
      </g>

      <!-- chips -->
      <g class="tag" font-family="'SFMono-Regular',Consolas,Menlo,monospace">
        <rect x="1002" y="384" width="176" height="28" rx="14" fill="#1E1510" stroke="#D97757" stroke-opacity=".55"/>
        <circle cx="1022" cy="398" r="4" fill="#28C840"/>
        <text x="1034" y="403" font-size="13" fill="#F5F0E8">system online</text>
        <rect x="22" y="384" width="150" height="28" rx="14" fill="#1E1510" stroke="#D97757" stroke-opacity=".55"/>
        <text x="40" y="403" font-size="13" fill="#C9B9A8">v5.2 · fable</text>
      </g>

      <!-- scanline sweep -->
      <rect class="scan" x="0" y="0" width="1200" height="26" fill="#F5F0E8" opacity=".035"/>
    </g>

    <!-- =============== BIOS PHASE =============== -->
    <g class="bios">
      <rect width="1200" height="430" fill="#0E0A08"/>
      <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17" fill="#E7DFD6">
        <g class="l1">
          <text x="70" y="88" fill="#D97757" font-weight="700">1COMMERCE BIOS — v5.2 FABLE EDITION</text>
        </g>
        <g class="l2">
          <text x="70" y="128">Memory check ......................... <tspan fill="#8C8178">128TB</tspan></text>
          <text x="560" y="128" class="ok ok2" fill="#28C840" font-weight="700">[ OK ]</text>
        </g>
        <g class="l3">
          <text x="70" y="164">Mounting /dev/commerce ...............</text>
          <text x="560" y="164" class="ok ok3" fill="#28C840" font-weight="700">[ OK ]</text>
        </g>
        <g class="l4">
          <text x="70" y="200">Loading cathedral.framework ..........</text>
          <text x="560" y="200" class="ok ok4" fill="#28C840" font-weight="700">[ OK ]</text>
        </g>
        <g class="l5">
          <text x="70" y="236">Starting claude-code daemon ..........</text>
          <text x="560" y="236" class="ok ok5" fill="#28C840" font-weight="700">[ OK ]</text>
        </g>
        <g class="l6">
          <text x="70" y="286" fill="#E8A33D">Boot sequence complete — launching desktop…</text>
          <rect class="caret" x="540" y="272" width="10" height="18" fill="#E8A33D"/>
        </g>
      </g>
      <rect x="70" y="330" width="640" height="10" rx="5" fill="#1E1814" stroke="#3A2E24"/>
      <rect class="boot-bar" x="72" y="332" width="636" height="6" rx="3" fill="#D97757"/>
    </g>

    <!-- blackout for clean loop -->
    <rect class="blackout" width="1200" height="430" fill="#0E0A08"/>
    <rect x=".75" y=".75" width="1198.5" height="428.5" rx="14" fill="none" stroke="#3A2E24" stroke-width="1.5"/>
  </g>
</svg>
