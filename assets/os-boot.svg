<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="1COMMERCE OS boot sequence">
  <!--
    1COMMERCE OS — boot hero.
    22s master loop: BIOS log (0–6s) → desktop reveal: synthwave grid + rising brand sun +
    glowing wordmark (6–20.5s) → fade to black (20.5–22s) → loop.
    Self-contained: no scripts, no external refs. CSS + SMIL only.
  -->
  <style>
    :root { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    /* ---------- master timeline: 22s ---------- */
    .bios      { animation: biosPhase 22s linear infinite; }
    .desktop   { animation: deskPhase 22s linear infinite; }
    .blackout  { animation: blackPhase 22s linear infinite; }

    @keyframes biosPhase  { 0% {opacity:1;} 25% {opacity:1;} 28% {opacity:0;} 100% {opacity:0;} }
    @keyframes deskPhase  { 0% {opacity:0;} 26% {opacity:0;} 30% {opacity:1;} 100% {opacity:1;} }
    @keyframes blackPhase { 0% {opacity:1;} 2% {opacity:0;} 92% {opacity:0;} 97% {opacity:1;} 100% {opacity:1;} }

    /* ---------- BIOS log: lines pop in one by one ---------- */
    .l1 { animation: pop 22s steps(1,end) infinite; }
    .l2 { animation: pop 22s steps(1,end) infinite; animation-delay: .9s; }
    .l3 { animation: pop 22s steps(1,end) infinite; animation-delay: 1.8s; }
    .l4 { animation: pop 22s steps(1,end) infinite; animation-delay: 2.7s; }
    .l5 { animation: pop 22s steps(1,end) infinite; animation-delay: 3.6s; }
    .l6 { animation: pop 22s steps(1,end) infinite; animation-delay: 4.5s; }
    @keyframes pop { 0% {opacity:0;} 1% {opacity:1;} 100% {opacity:1;} }
    /* status "OK" flickers on slightly after its line */
    .ok { animation: pop 22s steps(1,end) infinite; }
    .ok2 { animation-delay: 1.25s; } .ok3 { animation-delay: 2.15s; }
    .ok4 { animation-delay: 3.05s; } .ok5 { animation-delay: 3.95s; }

    .caret { animation: blink 1s steps(1,end) infinite; }
    @keyframes blink { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }

    /* progress bar under the BIOS log */
    .boot-bar { animation: bootbar 22s linear infinite; transform-origin: 0 50%; }
    @keyframes bootbar { 0% {transform:scaleX(0);} 24% {transform:scaleX(1);} 100% {transform:scaleX(1);} }

    /* ---------- desktop scene ---------- */
    .sun     { animation: sunrise 22s ease-out infinite; }
    @keyframes sunrise { 0%,26% {transform:translateY(150px);} 42% {transform:translateY(0);} 100% {transform:translateY(0);} }

    .word    { animation: wordin 22s ease-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    @keyframes wordin { 0%,28% {opacity:0; transform:scale(.92);} 36% {opacity:1; transform:scale(1);} 100% {opacity:1; transform:scale(1);} }

    .tag     { animation: tagin 22s ease-out infinite; }
    @keyframes tagin { 0%,34% {opacity:0;} 42% {opacity:.95;} 100% {opacity:.95;} }

    .glowpulse { animation: gp 4s ease-in-out infinite; }
    @keyframes gp { 0%,100% {opacity:.55;} 50% {opacity:1;} }

    .gridmove { animation: gm 1.6s linear infinite; }
    @keyframes gm { from {transform:translateY(0);} to {transform:translateY(26px);} }

    .star  { animation: twk 3.2s ease-in-out infinite; }
    .star.b { animation-delay: 1.1s; } .star.c { animation-delay: 2.2s; }
    @keyframes twk { 0%,100% {opacity:.15;} 50% {opacity:.9;} }

    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { from {transform:translateY(-40px);} to {transform:translateY(440px);} }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#0E0A08"/>
      <stop offset=".55" stop-color="#1E1814"/>
      <stop offset="1"  stop-color="#3A2113"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#E8A33D"/>
      <stop offset=".45" stop-color="#D97757"/>
      <stop offset="1"   stop-color="#7A2E1E"/>
    </linearGradient>
    <linearGradient id="wordgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F0E8"/>
      <stop offset=".6" stop-color="#F0C9A8"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <radialGradient id="sunglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#D97757" stop-opacity=".55"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D97757" stop-opacity="0"/>
      <stop offset="1" stop-color="#D97757" stop-opacity=".8"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="430" rx="14"/></clipPath>
    <clipPath id="ground"><rect x="0" y="268" width="1200" height="162"/></clipPath>
    <clipPath id="sunclip"><circle cx="600" cy="268" r="86"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <!-- =============== DESKTOP SCENE =============== -->
    <g class="desktop">
      <rect width="1200" height="430" fill="url(#sky)"/>

      <!-- stars -->
      <g fill="#F5F0E8">
        <circle class="star"   cx="120" cy="60"  r="1.6"/>
        <circle class="star b" cx="300" cy="110" r="1.2"/>
        <circle class="star c" cx="450" cy="45"  r="1.8"/>
        <circle class="star"   cx="760" cy="70"  r="1.3"/>
        <circle class="star b" cx="920" cy="40"  r="1.7"/>
        <circle class="star c" cx="1080" cy="95" r="1.4"/>
        <circle class="star"   cx="1020" cy="150" r="1.1"/>
        <circle class="star b" cx="200"  cy="160" r="1.2"/>
      </g>

      <!-- rising sun with slats -->
      <g class="sun">
        <circle cx="600" cy="268" r="150" fill="url(#sunglow)"/>
        <g clip-path="url(#sunclip)">
          <circle cx="600" cy="268" r="86" fill="url(#sunset)"/>
          <g fill="#1E1814">
            <rect x="500" y="238" width="200" height="5"/>
            <rect x="500" y="252" width="200" height="7"/>
            <rect x="500" y="268" width="200" height="9"/>
            <rect x="500" y="286" width="200" height="12"/>
          </g>
        </g>
      </g>

      <!-- horizon glow -->
      <rect x="0" y="262" width="1200" height="10" fill="#D97757" opacity=".55" filter="url(#soft)" class="glowpulse"/>

      <!-- perspective grid -->
      <g clip-path="url(#ground)">
        <rect x="0" y="268" width="1200" height="162" fill="#14100C"/>
        <!-- radial (vertical) lines -->
        <g stroke="#D97757" stroke-opacity=".45" stroke-width="1.4">
          <path d="M600 268 L600 430"/>
          <path d="M600 268 L440 430"/><path d="M600 268 L760 430"/>
          <path d="M600 268 L240 430"/><path d="M600 268 L960 430"/>
          <path d="M600 268 L-60 430"/><path d="M600 268 L1260 430"/>
          <path d="M600 268 L-480 430"/><path d="M600 268 L1680 430"/>
        </g>
        <!-- moving horizontal lines (26px period at bottom scale) -->
        <g class="gridmove" stroke="url(#gridfade)" stroke-width="1.6">
          <path d="M0 272 H1200"/><path d="M0 280 H1200"/>
          <path d="M0 292 H1200"/><path d="M0 308 H1200"/>
          <path d="M0 328 H1200"/><path d="M0 352 H1200"/>
          <path d="M0 380 H1200"/><path d="M0 412 H1200"/>
        </g>
        <rect x="0" y="268" width="1200" height="162" fill="url(#gridfade)" opacity=".06"/>
      </g>

      <!-- wordmark -->
      <g class="word" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
        <text x="600" y="205" font-size="86" font-weight="800" letter-spacing="8"
              fill="#D97757" opacity=".5" filter="url(#soft)">1COMMERCE OS</text>
        <text x="600" y="205" font-size="86" font-weight="800" letter-spacing="8"
              fill="url(#wordgrad)" stroke="#7A2E1E" stroke-width="1" paint-order="stroke">1COMMERCE OS</text>
      </g>
      <g class="tag" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
        <text x="600" y="242" font-size="19" font-weight="600" letter-spacing="6" fill="#F5F0E8">COMMERCE · SIMPLIFIED</text>
      </g>

      <!-- version chip -->
      <g class="tag" font-family="'SFMono-Regular',Consolas,Menlo,monospace">
        <rect x="1002" y="384" width="176" height="28" rx="14" fill="#1E1814" stroke="#3A2E24"/>
        <circle cx="1022" cy="398" r="4" fill="#28C840"/>
        <text x="1034" y="403" font-size="13" fill="#E7DFD6">system online</text>
      </g>
      <g class="tag" font-family="'SFMono-Regular',Consolas,Menlo,monospace">
        <rect x="22" y="384" width="150" height="28" rx="14" fill="#1E1814" stroke="#3A2E24"/>
        <text x="40" y="403" font-size="13" fill="#8C8178">v5.0 · fable</text>
      </g>

      <!-- scanline sweep -->
      <rect class="scan" x="0" y="0" width="1200" height="26" fill="#F5F0E8" opacity=".035"/>
    </g>

    <!-- =============== BIOS PHASE =============== -->
    <g class="bios">
      <rect width="1200" height="430" fill="#0E0A08"/>
      <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17" fill="#E7DFD6">
        <g class="l1">
          <text x="70" y="88" fill="#D97757" font-weight="700">1COMMERCE BIOS — v5.0 FABLE EDITION</text>
        </g>
        <g class="l2">
          <text x="70" y="128">Memory check ......................... <tspan fill="#8C8178">128TB</tspan></text>
          <text x="560" y="128" class="ok ok2" fill="#28C840" font-weight="700">[ OK ]</text>
        </g>
        <g class="l3">
          <text x="70" y="164">Mounting /dev/commerce ...............</text>
          <text x="560" y="164" class="ok ok3" fill="#28C840" font-weight="700">[ OK ]</text>
        </g>
        <g class="l4">
          <text x="70" y="200">Loading cathedral.framework ..........</text>
          <text x="560" y="200" class="ok ok4" fill="#28C840" font-weight="700">[ OK ]</text>
        </g>
        <g class="l5">
          <text x="70" y="236">Starting claude-code daemon ..........</text>
          <text x="560" y="236" class="ok ok5" fill="#28C840" font-weight="700">[ OK ]</text>
        </g>
        <g class="l6">
          <text x="70" y="286" fill="#E8A33D">Boot sequence complete — launching desktop…</text>
          <rect class="caret" x="540" y="272" width="10" height="18" fill="#E8A33D"/>
        </g>
      </g>
      <!-- boot progress bar -->
      <rect x="70" y="330" width="640" height="10" rx="5" fill="#1E1814" stroke="#3A2E24"/>
      <rect class="boot-bar" x="72" y="332" width="636" height="6" rx="3" fill="#D97757"/>
    </g>

    <!-- blackout for clean loop -->
    <rect class="blackout" width="1200" height="430" fill="#0E0A08"/>

    <!-- outer frame -->
    <rect x=".75" y=".75" width="1198.5" height="428.5" rx="14" fill="none" stroke="#3A2E24" stroke-width="1.5"/>
  </g>
</svg>
